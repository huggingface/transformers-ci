name: Integration-failure triage (daily Serge auto-fix)

# Reusable workflow. Computes the integration-test failure triage report from
# the daily CI dataset, then asks Serge to open a PR per ordered failure group.
# The Markdown report is kept as a build artifact.
#
# Lives in huggingface/transformers-ci and is called from a nightly caller in
# the transformers repo (see pr-ci-caller.yml for the caller pattern). The
# triage logic ships in this same `transformers-ci` package and is invoked via
# its `integration-failure-triage` console script, so this workflow installs the
# package rather than checking out a repo tree.
on:
  workflow_call:
    inputs:
      repo:
        description: "Target repo for the Serge PR (defaults to the calling repo)"
        type: string
        default: ""
      base_ref:
        description: "Branch the fix PR starts from"
        type: string
        default: main
      serge_url:
        description: "Serge base URL"
        type: string
        default: ""
      serge_timeout:
        description: "Seconds to wait for Serge to accept each task"
        type: string
        default: ""
      reconcile_timeout:
        description: "Seconds to poll Serge/GitHub after dispatch and refresh the tracking-issue table in place (0 disables)"
        type: string
        default: ""
      slack_channel:
        description: "Optional Slack channel for Serge task notifications"
        type: string
        default: ""
      notify_task_finished:
        description: "Ask Serge to notify Slack when each task finishes"
        type: boolean
        default: true
      transformersci_ref:
        description: "Ref of huggingface/transformers-ci to install the triage tooling from"
        type: string
        default: main
      assignees:
        description: "Comma/space-separated GitHub logins to assign the tracking issue to"
        type: string
        default: ""
      labels:
        description: "Comma/space-separated labels to add to the tracking issue"
        type: string
        default: ""
      dry_run:
        description: "Compute the report but do not dispatch to Serge"
        type: boolean
        default: false


permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    runs-on:
      group: aws-general-8-plus
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install triage tooling
        run: |
          set -euo pipefail
          if ! echo "$TRANSFORMERSCI_REF" | grep -qE '^[a-zA-Z0-9/_.-]+$'; then
            echo "::error::Invalid transformersci_ref format" >&2
            exit 1
          fi
          pip install "transformers-ci[agentic] @ git+https://github.com/huggingface/transformers-ci@${TRANSFORMERSCI_REF}"
        env:
          TRANSFORMERSCI_REF: ${{ inputs.transformersci_ref || 'main' }}

      # relore ships client and daemon as one version and refuses a request from
      # any other with 426, so a client pinned at install time goes dead the next
      # time the daemon is redeployed -- which is often. serge pins its client in
      # an image because a task pod cannot reach PyPI; this runner can, so it
      # checks the daemon's x-relore-version header and reinstalls when it is the
      # stale end. Never fails the run: every consumer of relore here is an extra
      # defer reason or auxiliary context, so a retrieval outage must shrink the
      # answer, never the night's work.
      - name: Match the relore client to the deployed daemon
        run: relore-ensure-current
        env:
          RELORE_API: ${{ vars.RELORE_API || 'https://ghlore.huggingface.tech' }}

      - name: Mint Serge OIDC token
        id: oidc
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS --fail \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=serge" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::failed to mint OIDC token" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Compute triage report and dispatch to Serge
        run: |
          integration-failure-triage \
            --repo "$TRIAGE_REPO" \
            --base-ref "$BASE_REF" \
            --serge-url "$SERGE_URL" \
            --serge-timeout "$SERGE_TIMEOUT" \
            --reconcile-timeout "$RECONCILE_TIMEOUT" \
            --report-out triage-report.md \
            $NOTIFY_TASK_FINISHED_ARG \
            $SLACK_CHANNEL_ARG \
            $DRY_RUN_ARG
        env:
          TRIAGE_REPO: ${{ inputs.repo || github.repository }}
          BASE_REF: ${{ inputs.base_ref || 'main' }}
          SERGE_URL: ${{ inputs.serge_url || vars.SERGE_URL || 'https://serge.huggingface.tech' }}
          SERGE_TIMEOUT: ${{ inputs.serge_timeout || vars.SERGE_TIMEOUT || '240' }}
          # Poll long enough to cover a full run: this run's tasks finished +2.7..+9.7 min
          # after dispatch (first PR at +7.6 min), so the old 300s default gave up before
          # any group resolved. Reconcile stops early once all groups resolve.
          RECONCILE_TIMEOUT: ${{ inputs.reconcile_timeout || vars.ITF_RECONCILE_TIMEOUT || '1200' }}
          # Cap how many failure groups become Serge tasks per nightly run; the
          # rest are dropped with a note. The slots are spread over failure
          # CATEGORIES (round-robin, see select_dispatch_targets), one per
          # category per cycle.
          # 3 while the reproduce-first loop was being validated in prod, then 5,
          # now 10. The script default is 20. See docs/plans/serge-reproduce-first.md.
          #
          # Note what the second five buy. The round-robin gives each category one
          # slot per cycle, so while the cap was <= the number of categories it
          # bought VARIETY -- that is the "five kinds of failure rather than five
          # expectation updates" this comment used to claim. On 2026-09-21 the run
          # dispatched exactly five categories with one group each, so a cap of 10
          # starts a second cycle and buys DEPTH: a second group per category. The
          # pool supports it (375 persistent failures, 327 of them unpinned), so
          # the cap is what binds, not the supply.
          #
          # Cost: ITF_SERGE_CONCURRENCY is unset here, so the dispatcher runs the
          # script default of 3 active tasks. 5 groups took 2h36m on 2026-09-21
          # (22:13 -> 00:50); 10 at the same concurrency is about 5h, ending ~03:15
          # UTC, and roughly doubles the GPU + token spend per night. Raise the
          # concurrency instead of the cap if wall-clock is what matters.
          ITF_MAX_GROUPS: ${{ vars.ITF_MAX_GROUPS || '10' }}
          # The dispatch-side "a human already has an open PR for this" check
          # (src/transformersci/agentic/relore_claims.py). Three states:
          #   off    — never asked (the code default)
          #   report — asked, recorded in the tracking issue, dispatch UNCHANGED
          #   defer  — the group is deferred and does not consume a --max-groups slot
          # Starts at `report` deliberately: transformers-ci#118 pre-registers a
          # precision measurement before this is allowed to change what the night
          # dispatches, and `report` yields that measurement at zero risk. Read the
          # "Would have been deferred as superseded" section of the tracking issue
          # for a week before considering `defer`.
          ITF_RELORE_SUPERSEDED: ${{ vars.ITF_RELORE_SUPERSEDED || 'report' }}
          # Base URL of the CI observability Grafana. Each Serge task PR body gets
          # a per-test dashboard link built here (Serge holds no Grafana config —
          # see src/transformersci/agentic/pr_evidence.py). Unset = no links.
          ITF_GRAFANA_URL: ${{ vars.ITF_GRAFANA_URL || 'https://transformers-ci.lor-e.huggingface.cool' }}
          SERGE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # Hand the tracking issue to a human and (by default) auto-close the
          # prior day's issue with a "Superseded by #N" link so they don't pile up.
          # Falls back to tarekziade when no input/repo-var overrides it.
          ITF_TRIAGE_ASSIGNEES: ${{ inputs.assignees || vars.ITF_TRIAGE_ASSIGNEES || 'tarekziade' }}
          ITF_TRIAGE_LABELS: ${{ inputs.labels || vars.ITF_TRIAGE_LABELS || '' }}
          NOTIFY_TASK_FINISHED_ARG: ${{ inputs.notify_task_finished && '--notify-task-finished' || '' }}
          SLACK_CHANNEL_ARG: ${{ inputs.slack_channel != '' && format('--slack-channel {0}', inputs.slack_channel) || '' }}
          DRY_RUN_ARG: ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload triage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-failure-triage-report
          path: triage-report.md
          retention-days: 90
          if-no-files-found: warn
