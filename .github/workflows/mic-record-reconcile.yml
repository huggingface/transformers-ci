name: record-mic reconcile

# Hourly: the record-mic overlay of a Transformers PR that has merged goes into the MIC fleet (its
# re-recorded expected values go live with its code); one whose PR closed without merging is
# dropped. Runs no PR code. See src/transformersci/contracts/record_mic_reconcile.py.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Merge or drop (off: report only)"
        type: boolean
        default: true

concurrency:
  group: mic-record-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[contracts]"

      - name: Reconcile
        env:
          HF_TOKEN: ${{ secrets.MIC_RECORD_WRITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
        run: |
          args=(--summary "$GITHUB_STEP_SUMMARY")
          [[ "$EXECUTE" == true ]] && args+=(--execute)
          record-mic-reconcile "${args[@]}"
