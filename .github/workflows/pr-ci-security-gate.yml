name: PR CI Security Gate

on:
  workflow_call:
    inputs:
      protected_paths:
        description: >-
          Newline-separated paths an untrusted PR may not add, change, rename or delete — the
          files that decide how CI treats a PR, so a PR cannot edit the rules being applied to
          it. A value ending in `/` protects the whole directory. Opt-in: left unset, this
          workflow behaves exactly as it did before the input existed.
        type: string
        default: ""

permissions: {}

jobs:
  get-changed-files:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
      contents: read
    outputs:
      has_py: ${{ steps.py-check.outputs.has_py }}
    steps:
      - name: Get changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PROTECTED_PATHS: ${{ inputs.protected_paths }}
        run: |
          # Pre-check: changed_files on the PR object may reflect the true count before the
          # REST file-listing endpoint's 3000-file cap kicks in (not officially documented)
          changed_files_count=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')
          echo "Total files changed: $changed_files_count"
          if [ "$changed_files_count" -ge 50 ]; then
            echo "::error::PR touches $changed_files_count files — only PRs with fewer than 50 changed files are automatically approved. A maintainer must review and approve CI manually."
            exit 1
          fi

          # Save full API response (includes patches) and extract non-deleted filenames
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" | jq -s 'add' > /tmp/pr_files.json
          jq -r '.[] | select(.status != "removed") | .filename' /tmp/pr_files.json > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt
          grep '\.py$' /tmp/changed_files.txt > /tmp/py_files.txt || true

          # The list the protected-path check below reads. With nothing protected there is nothing
          # to widen it for, so it stays changed_files.txt and this workflow does what it always
          # did. With paths protected it has to be wider than changed_files.txt, which holds the
          # files that still exist at the head (what the Bandit steps need, since they fetch each
          # file's contents): a file the PR deletes is not in it at all, and a renamed file appears
          # only under its new name — yet deleting a protected file, or moving it out from under
          # its rule, reaches it as much as editing it does.
          if [ -n "${PROTECTED_PATHS//[[:space:]]/}" ]; then
            jq -r '.[] | .filename, (.previous_filename // empty)' /tmp/pr_files.json |
              sort -u > /tmp/touched_paths.txt
            echo "Paths touched (including deletions and the old name of a rename):"
            cat /tmp/touched_paths.txt
          else
            cp /tmp/changed_files.txt /tmp/touched_paths.txt
          fi

      - name: Block changes to protected paths
        env:
          PROTECTED_PATHS: ${{ inputs.protected_paths }}
        run: |
          # A caller that protects nothing gets an empty list here and this loop does nothing, so
          # the gate is unchanged for it.
          #
          # For a caller that does protect paths — such as a reviewer codeowners file — the point
          # is that the rules CI applies to a PR are not the PR's to edit. It is a second lock on
          # a door that is usually already locked (`assign-reviewers`, for one, reads the
          # codeowners file from the base and never from the head), and the one that keeps holding
          # if a protected file ever moves somewhere the directory allowlist below would let
          # through.
          failed=0
          while IFS= read -r protected; do
            [ -n "$protected" ] || continue
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$protected" in
                */) [ "${file##"$protected"}" != "$file" ] || continue ;;
                *)  [ "$file" = "$protected" ] || continue ;;
              esac
              echo "::error::PR modifies $file, a path this repository protects from untrusted PRs. A maintainer must make this change in a separate PR."
              failed=1
            done < /tmp/touched_paths.txt
          done <<< "$PROTECTED_PATHS"
          [ "$failed" -eq 0 ] || exit 1

      - name: Enforce allowlist — only src/tests/docs/utils, only .py/.txt/.md
        run: |
          failed=0
          while IFS= read -r file; do
            # Rule 1: file must be inside one of the four allowed top-level directories
            if ! echo "$file" | grep -qE '^(src|tests|docs|utils)/'; then
              echo "::error::File is outside allowed directories (src, tests, docs, utils): $file"
              failed=1
            # Rule 2: under docs/ only .md and .yml are allowed
            elif echo "$file" | grep -qE '^docs/' && ! echo "$file" | grep -qE '\.(md|yml)$'; then
              echo "::error::File type not allowed in docs/ (only .md, .yml permitted): $file"
              failed=1
            # Rule 3: under tests/ any file type is allowed; everywhere else only .py/.txt/.md
            elif ! echo "$file" | grep -qE '^(tests|docs)/' && ! echo "$file" | grep -qE '\.(py|txt|md)$'; then
              echo "::error::File type not allowed (only .py, .txt, .md permitted outside tests/ and docs/): $file"
              failed=1
            fi
          done < /tmp/changed_files.txt
          [ "$failed" -eq 0 ] || exit 1

      - name: Check if Python files changed
        id: py-check
        run: |
          if [ -s /tmp/py_files.txt ]; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Python files changed — skipping Bandit"
            echo "has_py=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch changed Python files at PR head (no fork checkout)
        if: steps.py-check.outputs.has_py == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch each changed .py file's blob at the PR head SHA via the REST contents
          # API and stage it under /tmp/pr_py, preserving its path. This never checks out
          # (nor executes) fork code — Bandit only parses the file's AST — so it is safe
          # under pull_request_target, avoiding actions/checkout's fork-checkout refusal
          # ("pwn request" hardening) without opting into allow-unsafe-pr-checkout.
          mkdir -p /tmp/pr_py
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "/tmp/pr_py/$(dirname "$f")"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/$f?ref=$HEAD_SHA" > "/tmp/pr_py/$f"
          done < /tmp/py_files.txt

      - name: Upload Bandit inputs
        if: steps.py-check.outputs.has_py == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bandit-inputs
          path: |
            /tmp/pr_files.json
            /tmp/py_files.txt
            /tmp/pr_py

  bandit-check:
    needs: get-changed-files
    if: needs.get-changed-files.outputs.has_py == 'true'
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Download Bandit inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bandit-inputs
          path: /tmp

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit on changed Python files
        run: |
          # Bandit runs against the file blobs staged by get-changed-files (fetched via
          # the contents API, not a fork checkout). Run from /tmp/pr_py so the relative
          # paths in py_files.txt resolve and Bandit's reported filenames match the API
          # filenames used for patch mapping in the next step.
          cd /tmp/pr_py
          # -d '\n': split on newlines only (handles filenames with spaces)
          # --: end of options, prevents filenames starting with '-' being treated as flags
          xargs -d '\n' bandit --format json -l --ignore-nosec -o /tmp/bandit_report.json -- < /tmp/py_files.txt || true

      - name: Check for new high severity issues
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          if not os.path.exists('/tmp/bandit_report.json'):
              print("::error::Bandit report not found — Bandit may have crashed before writing output")
              sys.exit(1)

          with open('/tmp/bandit_report.json') as f:
              try:
                  report = json.load(f)
              except json.JSONDecodeError as e:
                  print(f"::error::Failed to parse Bandit report: {e}")
                  sys.exit(1)
          with open('/tmp/pr_files.json') as f:
              pr_files = json.load(f)

          SHELL_TESTS = re.compile(r'^B60[1-79]$')

          findings = [
              r for r in report.get('results', [])
              if r['issue_severity'] == 'HIGH' or SHELL_TESTS.match(r['test_id'])
          ]
          if not findings:
              print("No issues found")
              sys.exit(0)

          def added_lines(patch):
              """Return set of line numbers (in the new file) that were added by the PR."""
              added = set()
              current_line = 0
              for line in (patch or '').split('\n'):
                  if line.startswith('@@'):
                      m = re.search(r'\+(\d+)(?:,\d+)?', line)
                      if m:
                          current_line = int(m.group(1))
                  elif line.startswith('+') and not line.startswith('+++'):
                      added.add(current_line)
                      current_line += 1
                  elif not line.startswith('-'):
                      current_line += 1
              return added

          patch_map = {f['filename']: f.get('patch') for f in pr_files}

          new_issues = []
          for finding in findings:
              # Bandit reports './path/to/file.py', API returns 'path/to/file.py'
              filename = finding['filename'].lstrip('./')
              patch = patch_map.get(filename)
              if patch is None:
                  # Patch truncated (large file) — treat conservatively as new issue
                  new_issues.append(finding)
              elif finding['line_number'] in added_lines(patch):
                  new_issues.append(finding)

          if new_issues:
              print(f"::error::Found {len(new_issues)} issue(s) introduced by this PR:")
              for i in new_issues:
                  print(f"  {i['filename']}:{i['line_number']} [{i['test_id']}] [{i['issue_severity']}] {i['issue_text']}")
              sys.exit(1)

          print(f"Issues found in {len(findings)} location(s) but all pre-existing — OK")
          EOF

  post-failure-comment:
    needs: [get-changed-files, bandit-check]
    if: failure()
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Post failure comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Delete any previous security gate failure comment to avoid duplicates
          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("CI Security Gate — automatic approval blocked")) | .id' \
            | head -1)
          if [ -n "$comment_id" ]; then
            gh api --method DELETE "repos/$REPO/issues/comments/$comment_id"
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Thank you for your contribution 🤗!

          ## CI Security Gate — automatic approval blocked

          This PR was **not** automatically approved for CI because the security gate failed.

          **Possible reasons:**
          - The PR touches 50 or more files — only PRs with fewer than 50 changed files are automatically approved
          - A changed file is outside the allowed directories (\`src/\`, \`tests/\`, \`docs/\`, \`utils/\`), has a disallowed extension (only \`.py\`, \`.txt\`, \`.md\` permitted outside \`tests/\` and \`docs/\`), or is not \`.md\`/\`.yml\` inside \`docs/\`
          - A new high-severity security issue was detected in the changed Python files (Bandit check)
          - The PR touches a path this repository protects from untrusted PRs, such as the file that decides who reviews it — a maintainer must make that change in a separate PR

          See the [workflow run]($RUN_URL) for the exact violations.

          A maintainer can review and manually approve CI if a finding is a false positive."

  approve-pr-ci:
    needs: [get-changed-files, bandit-check]
    if: >-
      always() &&
      needs.get-changed-files.result == 'success' &&
      (needs.bandit-check.result == 'success' || needs.bandit-check.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Find and approve the pending PR CI workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 12); do
            run_id=$(gh api \
              "repos/$REPO/actions/runs?event=pull_request&head_sha=$HEAD_SHA&status=action_required" \
              --jq '.workflow_runs[] | select(.name == "PR CI") | .id' | head -1)
            if [ -n "$run_id" ]; then
              gh api --method POST "repos/$REPO/actions/runs/$run_id/approve"
              echo "Approved run $run_id"
              exit 0
            fi
            echo "Attempt $i: run not yet pending, retrying in 5s..."
            sleep 5
          done
          echo "No pending PR CI run found after retries — skipping"
