name: "[Reusable] Model integration contracts"

# Runs slim fixture contracts against the Transformers checkout.
# Phase 1 — observational: failures are reported but do not block the PR.

on:
  workflow_call:
    inputs:
      docker_image:
        description: "Container image to run the job in"
        type: string
        required: true
      runner:
        description: "Runner group"
        type: string
        required: true
      ci_sha:
        description: "Revision of huggingface/transformers-ci containing the MIC runner"
        type: string
        required: true
      run_declared:
        description: "Also run variants the contracts declare unmeasured (a PR label `mic-run-declared` does the same)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  run:
    # Infrastructure failures must not block PRs during the observational rollout.
    continue-on-error: true
    runs-on:
      group: ${{ inputs.runner }}
    timeout-minutes: 15
    container:
      image: ${{ inputs.docker_image }}
      options: "--shm-size=16gb"
    env:
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      # Not the shared /mnt/cache: PR jobs mount it read-only.
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install
        id: install
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$SECONDS
          uv pip install -e .
          uv pip install "transformers-ci[contracts,otel] @ git+https://github.com/huggingface/transformers-ci@${INPUTS_CI_SHA}"
          uv pip install timm jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          uv pip install 'torch>=2.15.0' 'torchaudio' 'torchvision' 'torchcodec>=0.17.0' --index-url https://download.pytorch.org/whl/cpu
          echo "Installed in $((SECONDS - start)) s on $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"
        env:
          INPUTS_CI_SHA: ${{ inputs.ci_sha }}

      # Restore only: saving is a separate step that skips PRs (see the end of the job).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hf_cache
        continue-on-error: true
        with:
          path: /tmp/hf_home/hub
          key: contracts-hf-${{ runner.arch }}-${{ inputs.ci_sha }}

      - name: Show installed library versions
        run: pip list --format=freeze | tee installed.txt

      - name: Generate test file
        id: generate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          export PYTHONPATH="$PWD/src"
          python utils/generate_fast_integration_tests.py

      - name: Run contracts as pytest
        id: run
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          export PYTHONPATH="$PWD/src"
          pytest tests/test_fast_integration.py -v 2>&1 | tee /tmp/run.log

      - name: Summary
        id: summary
        if: always()
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          touch /tmp/results.jsonl
          {
            echo "**Observational run:** failures do not block this PR."
            echo
            echo "Source: \`$GITHUB_SHA\`; event: \`$GITHUB_EVENT_NAME\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if command -v report-model-contracts >/dev/null 2>&1; then
            report-model-contracts /tmp/results.jsonl --log /tmp/run.log \
              >> "$GITHUB_STEP_SUMMARY" || \
              echo "Could not render the contract report; see the artifact and job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Contract runner was not installed; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY_RESULT'
          import json
          import os
          from collections import Counter
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path
          from platform import python_version

          results = Path('/tmp/results.jsonl')
          rows = [json.loads(line) for line in results.read_text().splitlines() if line.strip()]
          log = Path('/tmp/run.log')
          selections = [json.loads(line) for line in log.read_text().splitlines() if line.startswith('{"selection"')] if log.exists() else []
          packages = ['torch', 'torchvision', 'torchaudio', 'numpy', 'tokenizers', 'transformers', 'transformers-ci']
          versions = {'python': python_version()}
          for package in packages:
              try:
                  versions[package] = version(package)
              except PackageNotFoundError:
                  versions[package] = None
          report = {
              'event': os.environ['GITHUB_EVENT_NAME'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'pr': json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text()).get('pull_request', {}).get('number'),
              'install_outcome': os.environ['INSTALL_OUTCOME'],
              'run_outcome': os.environ['RUN_OUTCOME'],
              'versions': versions,
              'counts': dict(Counter(row['status'] for row in rows)),
              'selections': [item['selection'] for item in selections],
              'results': len(rows),
          }
          Path('/tmp/contracts-observation.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Observation:', json.dumps(report))
          PY_RESULT

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        continue-on-error: true
        with:
          name: contracts
          path: |
            /tmp/results.jsonl
            /tmp/run.log
            /tmp/contracts-observation.json
            tests/test_fast_integration.py

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          !cancelled() && github.event_name != 'pull_request'
          && steps.install.outcome == 'success' && steps.hf_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: /tmp/hf_home/hub
          key: contracts-hf-${{ runner.arch }}-${{ inputs.ci_sha }}

      - name: Flag contract failures for review
        if: always() && (steps.install.outcome == 'failure' || steps.generate.outcome == 'failure' || steps.run.outcome == 'failure' || steps.summary.outcome == 'failure')
        run: |
          echo "::warning::A model integration contract failed or could not run; see the job summary and artifact for details. This observation does not block the PR."
