name: "[Reusable] Model integration contracts"

# Runs slim fixture contracts against the Transformers checkout.
# Phase 1 — observational: failures are reported but do not block the PR.

on:
  workflow_call:
    inputs:
      docker_image:
        description: "Container image to run the job in"
        type: string
        required: true
      runner:
        description: "Runner group"
        type: string
        required: true
      ci_sha:
        description: "Revision of huggingface/transformers-ci containing the MIC runner"
        type: string
        required: true

permissions:
  contents: read

jobs:
  run:
    # Infrastructure failures must not block PRs during the observational rollout.
    continue-on-error: true
    runs-on:
      group: ${{ inputs.runner }}
    timeout-minutes: 15
    container:
      image: ${{ inputs.docker_image }}
      options: "--shm-size=16gb"
    env:
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      # Not the shared /mnt/cache: PR jobs mount it read-only.
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full clone — needed to compute changed files via git diff on PR events.
          fetch-depth: 0

      - name: Install
        id: install
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$SECONDS
          uv pip install -e .
          uv pip install "transformers-ci[contracts,otel] @ git+https://github.com/huggingface/transformers-ci@${INPUTS_CI_SHA}"
          uv pip install timm jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          echo "Installed in $((SECONDS - start)) s on $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"
        env:
          INPUTS_CI_SHA: ${{ inputs.ci_sha }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: /tmp/hf_home/hub
          key: contracts-hf-${{ runner.arch }}-${{ inputs.ci_sha }}

      - name: Run the contracts
        id: run
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          export PYTHONPATH="$PWD/src"
          python - <<'PY_SOURCE'
          from pathlib import Path
          import transformers
          expected = Path.cwd() / "src/transformers/__init__.py"
          actual = Path(transformers.__file__).resolve()
          assert actual == expected.resolve(), (actual, expected)
          print("Framework under test:", actual)
          import torch
          assert torch.get_num_threads() == 4, torch.get_num_threads()
          print("CPU threads:", torch.get_num_threads())
          PY_SOURCE
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed-files.txt
            selection=(--changed-files /tmp/changed-files.txt)
            echo "Changed files: $(wc -l < /tmp/changed-files.txt)"; head -20 /tmp/changed-files.txt
          else
            selection=(--run-all)
            echo "Changed files: all"
          fi
          # Read fleet pins from the checkout so PRs exercise their own lock changes.
          # Use the normal OTEL resource setup so cases appear in the PR dashboard.
          mic() {
            configure-ci-otel --suite fast-integration --service-name pytest-observability \
              --protocol http --otlp-endpoint "$OTEL_EXPORTER_OTLP_ENDPOINT" \
              --token "$OTEL_TOKEN" --staging-endpoint 10.90.52.50:5317 \
              --staging-protocol grpc -- run-model-contracts "$@"
          }
          start=$SECONDS
          mic --fixtures-only --lock tests/contracts/fleet-lock.json --variant default \
            "${selection[@]}" --output /tmp/results.jsonl 2> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              if not line.startswith("{"):
                  print(line.rstrip(), flush=True)
                  continue
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("platform", ""), "\n".join(r.get("failures", [])), flush=True)' || status=$?
          echo "$(tail -1 /tmp/run.log); $((SECONDS - start)) s"
          mic --fixtures-only --lock tests/contracts/prototype-fleet.lock --variant bfloat16 \
            "${selection[@]}" --output /tmp/results.jsonl 2>> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              if not line.startswith("{"):
                  print(line.rstrip(), flush=True)
                  continue
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("variant", ""), r.get("platform", ""), "\n".join(r.get("failures", [])), flush=True)' || status=$?
          # Preserve full runner diagnostics in the visible job log as well as artifacts.
          cat /tmp/run.log
          exit "${status:-0}"

      - name: Summary
        id: summary
        if: always()
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          touch /tmp/results.jsonl
          {
            echo "**Observational run:** failures do not block this PR."
            echo
            echo "Source: \`$GITHUB_SHA\`; event: \`$GITHUB_EVENT_NAME\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if command -v report-model-contracts >/dev/null 2>&1; then
            report-model-contracts /tmp/results.jsonl --log /tmp/run.log \
              >> "$GITHUB_STEP_SUMMARY" || \
              echo "Could not render the contract report; see the artifact and job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Contract runner was not installed; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY_RESULT'
          import json
          import os
          from collections import Counter
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path
          from platform import python_version

          results = Path('/tmp/results.jsonl')
          rows = [json.loads(line) for line in results.read_text().splitlines() if line.strip()]
          log = Path('/tmp/run.log')
          selections = [json.loads(line) for line in log.read_text().splitlines() if line.startswith('{"selection"')] if log.exists() else []
          packages = ['torch', 'torchvision', 'torchaudio', 'numpy', 'tokenizers', 'transformers', 'transformers-ci']
          versions = {'python': python_version()}
          for package in packages:
              try:
                  versions[package] = version(package)
              except PackageNotFoundError:
                  versions[package] = None
          report = {
              'event': os.environ['GITHUB_EVENT_NAME'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'pr': json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text()).get('pull_request', {}).get('number'),
              'install_outcome': os.environ['INSTALL_OUTCOME'],
              'run_outcome': os.environ['RUN_OUTCOME'],
              'versions': versions,
              'counts': dict(Counter(row['status'] for row in rows)),
              'selections': [item['selection'] for item in selections],
              'results': len(rows),
          }
          Path('/tmp/contracts-observation.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Observation:', json.dumps(report))
          PY_RESULT

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        continue-on-error: true
        with:
          name: contracts
          path: |
            /tmp/results.jsonl
            /tmp/run.log
            /tmp/contracts-observation.json

      - name: Flag contract failures for review
        if: always() && (steps.install.outcome == 'failure' || steps.run.outcome == 'failure' || steps.summary.outcome == 'failure')
        run: |
          echo "::warning::A model integration contract failed or could not run; see the job summary and artifact for details. This observation does not block the PR."
