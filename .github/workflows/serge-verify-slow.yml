name: serge verify slow (GPU)

# =============================================================================
# Reusable GPU verify job for the serge auto-fix loop.
#
# serge produces a candidate patch for a coherent failure group (see
# integration_failure_triage.py) and needs to know whether it actually turns the
# targeted @slow tests red -> green WITHOUT breaking neighbours, before opening a
# PR. This runs the targeted node-ids on the pre-patch tree (baseline) and on
# serge's candidate (patched), repeating each tree's run VERIFY_RUNS times (fresh
# process each) to rule out flakiness, and emits a machine-readable verdict.
#
# It is a thin variant of transformers-ci's daily-ci_reusable_model_job.yml
# (itself ported from transformers model_jobs.yml): SAME prebaked image, SAME
# warm model cache (HF_HOME=/mnt/cache + the -v mount), SAME GPU runner groups.
# We do NOT rebuild any of that. The only differences: we run a specific set of
# node-ids (not a whole tests/models/<model> folder), we run each tree
# VERIFY_RUNS times, and we emit reports/verify-result.json via the
# `serge-verify-verdict` console script.
#
# Two modes (input `mode`):
#   verify    (default) — baseline + patched, red→green gate (fixed | not_fixed | …)
#   reproduce           — baseline only, run BEFORE serge investigates to confirm the
#                         failure is real (reproduced | not_reproduced | error). Skips
#                         the patched checkout/run entirely.
#
# A caller in huggingface/transformers (workflow_dispatch, behind the same
# maintainer allow-list as run-slow) invokes this; serge triggers that caller
# and polls the `serge-verify-result` artifact. See
# transformers-ci-playbooks docs/plans/serge-gpu-verify-loop.md.
# =============================================================================

on:
  workflow_call:
    inputs:
      mode:
        description: "verify (baseline+patched red→green gate) | reproduce (baseline only, confirm the failure is real before serge investigates)"
        required: false
        type: string
        default: verify
      base_sha:
        description: "Pre-patch tree — targeted tests MUST be red here (baseline-red guard)"
        required: true
        type: string
      commit_sha:
        description: "serge's candidate tree — targeted tests should be green here (unused when mode=reproduce)"
        required: false
        type: string
        default: ""
      test_nodeids:
        description: "Space-separated pytest node-ids for the group"
        required: true
        type: string
      model:
        description: "Model folder for the optional collateral suite, e.g. `whisper`"
        required: true
        type: string
      machine_type:
        description: "Runner group: aws-g5-4xlarge-cache (single) / aws-g5-12xlarge-cache (multi)"
        required: true
        type: string
      docker:
        description: "Prebaked GPU image (same as run-slow)"
        required: false
        type: string
        default: huggingface/transformers-all-latest-gpu
      run_collateral:
        description: "Also run the full tests/models/<model> slow suite on both trees"
        required: false
        type: boolean
        default: false
      memory_probe:
        description: "Diagnostic: record per-test device memory, including how much survives a gc.collect(), and upload it as an artifact. Off by default — the collect frees memory, so it can stop a memory-related failure from reproducing."
        required: false
        type: boolean
        default: false
      transformersci_ref:
        description: "Ref of huggingface/transformers-ci to install the verdict tool from"
        required: false
        type: string
        default: main
    secrets:
      HF_HUB_READ_TOKEN:
        required: true
    outputs:
      verdict:
        description: "verify: fixed | not_fixed | already_passing | broke_others | error · reproduce: reproduced | not_reproduced | error"
        value: ${{ jobs.verify.outputs.verdict }}

env:
  HF_HOME: /mnt/cache               # reuse the warm, node-local model cache
  TRANSFORMERS_IS_CI: yes
  RUN_SLOW: yes
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  CUDA_VISIBLE_DEVICES: 0,1
  NO_COLOR: 1
  # Run the TARGETED tests this many times per tree (baseline + patched), each a
  # fresh pytest process, so the red→green verdict only survives if the tests are
  # stable (no flaky pass/fail). The verdict tool then requires EVERY run to hold.
  # Kept small: these are @slow GPU tests and each run adds wall-clock — 5 stays
  # well inside serge's verify poll_timeout (2400s). (We loop pytest by hand
  # rather than use pytest-flakefinder, whose test-renaming breaks selecting a
  # specific parametrized node-id like `test_x[float16]`.)
  VERIFY_RUNS: "5"

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ inputs.model }} (${{ inputs.machine_type }})
    runs-on:
      group: '${{ inputs.machine_type }}'          # same runner groups / ARC scale sets as run-slow
    container:
      image: ${{ inputs.docker }}                  # same prebaked image
      options: --gpus all --shm-size "16gb" --ipc host -v /mnt/cache/.cache/huggingface:/mnt/cache/
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Install the verdict tool (transformers-ci)
        run: python3 -m pip install "transformers-ci[agentic] @ git+https://github.com/huggingface/transformers-ci@${TRANSFORMERSCI_REF}"
        env:
          TRANSFORMERSCI_REF: ${{ inputs.transformersci_ref || 'main' }}

      # The plugin ships in the same package as the verdict tool but under a
      # different extra, and it auto-activates via its pytest11 entry point. Only
      # installed when probing so a normal verify run is untouched.
      - name: Install the resource plugin (transformers-ci[otel])
        if: ${{ inputs.memory_probe }}
        run: python3 -m pip install "transformers-ci[otel] @ git+https://github.com/huggingface/transformers-ci@${TRANSFORMERSCI_REF}"
        env:
          TRANSFORMERSCI_REF: ${{ inputs.transformersci_ref || 'main' }}

      - name: Prepare reports dir
        working-directory: /transformers
        run: mkdir -p reports && rm -f reports/*.xml

      # A verify-only pytest plugin that makes the ACTUAL output visible to serge.
      # torch.testing.assert_close prints only diff STATS, never the actual tensor,
      # so for stale-logits test failures the LLM has nothing to rewrite the
      # expected values from. Raising torch's print threshold + running pytest with
      # --showlocals dumps the failing frame's locals (incl. the actual output) IN
      # FULL into the traceback longrepr — which is what serge reads (JUnit
      # <failure> body). Loaded via `-p serge_showlocals` (a root conftest.py would
      # clobber transformers' own).
      - name: Install serge showlocals plugin
        run: |
          cat > /tmp/serge_showlocals.py <<'PLUGIN'
          import torch

          def pytest_configure(config):
              # threshold: print tensors up to 10k elements in full (no `[…]`);
              # sci_mode off + fixed precision so values are copy-pasteable.
              torch.set_printoptions(
                  threshold=10_000, precision=6, sci_mode=False, linewidth=200
              )
              # Collapse nn.Module reprs to one line. --showlocals otherwise dumps
              # the ENTIRE model (~150KB for a big model) as a local, which crowds
              # out the actual/expected tensors within serge's REPRODUCE_TB_CHARS
              # budget (the tensors get tail-truncated away). The model structure is
              # noise for fixing a stale-expectation assertion; the tensors are the
              # signal. Verify pod is ephemeral, so monkeypatching the repr is safe.
              torch.nn.Module.__repr__ = lambda self: f"<{type(self).__name__}>"
          PLUGIN

      # ---- Baseline: pre-patch tree. Targeted tests must be RED here. ----
      - name: Checkout baseline tree
        working-directory: /transformers
        env:
          base_sha: ${{ inputs.base_sha }}
        run: |
          git fetch origin "$base_sha" && git checkout "$base_sha"
          python3 -m pip uninstall -y transformers && python3 -m pip install -e .

      - name: Run targeted tests (baseline)
        working-directory: /transformers
        env:
          nodeids: ${{ inputs.test_nodeids }}
          PYTEST_RESOURCE_METRICS_FILE: ${{ inputs.memory_probe && '/transformers/reports/resource-metrics.jsonl' || '' }}
          PYTEST_RESOURCE_GC_PROBE: ${{ inputs.memory_probe && '1' || '' }}
        run: |
          # -vv: disables pytest's assertion-diff truncation ("Diff is N characters
          # long"). --showlocals + the serge_showlocals plugin: dump the failing
          # frame's locals (incl. the actual output tensor, in full) into the
          # traceback so serge can reconstruct stale expected values. Both land in
          # each baseline_<i>.xml, which serge seeds into the fix prompt.
          # Loop VERIFY_RUNS times (fresh process each) so a flaky pass can't
          # sneak past the baseline-red guard — the verdict requires every run red.
          for i in $(seq 1 "$VERIFY_RUNS"); do
            # shellcheck disable=SC2086  # $nodeids is a space-separated list of pytest args — must word-split
            PYTHONPATH=/tmp python3 -m pytest -p serge_showlocals --showlocals \
              -rsfE -vv --junitxml="reports/baseline_${i}.xml" $nodeids || true
          done

      - name: Run collateral suite (baseline)
        if: ${{ inputs.mode == 'verify' && inputs.run_collateral }}
        working-directory: /transformers
        env:
          model: ${{ inputs.model }}
        run: |
          python3 -m pytest -rsfE -q --junitxml=reports/collateral_baseline.xml "tests/models/${model}" || true

      # ---- Patched: serge's candidate. Targeted tests should be GREEN here. ----
      # Skipped entirely for mode=reproduce, which only confirms the baseline failure.
      - name: Checkout patched tree
        if: ${{ inputs.mode == 'verify' }}
        working-directory: /transformers
        env:
          commit_sha: ${{ inputs.commit_sha }}
        run: |
          git fetch origin "$commit_sha" && git checkout "$commit_sha"
          python3 -m pip install -e .

      - name: Run targeted tests (patched)
        if: ${{ inputs.mode == 'verify' }}
        working-directory: /transformers
        env:
          nodeids: ${{ inputs.test_nodeids }}
          PYTEST_RESOURCE_METRICS_FILE: ${{ inputs.memory_probe && '/transformers/reports/resource-metrics.jsonl' || '' }}
          PYTEST_RESOURCE_GC_PROBE: ${{ inputs.memory_probe && '1' || '' }}
        run: |
          # -vv + --showlocals + serge_showlocals: full diffs and actual-output
          # locals (see the baseline step) for the retry-round feedback serge seeds
          # when a patch is still not_fixed.
          # Loop VERIFY_RUNS times (fresh process each): the patch only counts as
          # fixed if every run is green, so a flaky pass can't be mistaken for a fix.
          for i in $(seq 1 "$VERIFY_RUNS"); do
            # shellcheck disable=SC2086  # $nodeids is a space-separated list of pytest args — must word-split
            PYTHONPATH=/tmp python3 -m pytest -p serge_showlocals --showlocals \
              -rsfE -vv --junitxml="reports/patched_${i}.xml" $nodeids || true
          done

      - name: Run collateral suite (patched)
        if: ${{ inputs.mode == 'verify' && inputs.run_collateral }}
        working-directory: /transformers
        env:
          model: ${{ inputs.model }}
        run: |
          python3 -m pytest -rsfE -q --junitxml=reports/collateral.xml "tests/models/${model}" || true

      # ---- Verdict. serge decides off this JSON, not the exit code. ----
      - name: Compute verdict
        id: verdict
        working-directory: /transformers
        env:
          mode: ${{ inputs.mode }}
          nodeids: ${{ inputs.test_nodeids }}
          base_sha: ${{ inputs.base_sha }}
          commit_sha: ${{ inputs.commit_sha }}
          machine_type: ${{ inputs.machine_type }}
        run: |
          # NOTE: GitHub runs these container steps with `sh` (not bash) — keep
          # this POSIX: no arrays, no `shopt`. Build space-separated arg lists and
          # let word-splitting expand them into separate args below.
          # One XML per repeated run (see the loops above): pass them all so the
          # verdict requires stability across every run. An unmatched glob stays
          # literal in sh, so guard each with `-e`. --patched only exists in verify
          # mode; --collateral only when that suite ran.
          baseline_files=""
          for f in reports/baseline_*.xml; do
            [ -e "$f" ] && baseline_files="$baseline_files $f"
          done
          patched_files=""
          for f in reports/patched_*.xml; do
            [ -e "$f" ] && patched_files="$patched_files $f"
          done
          patched_arg=""
          [ -n "$patched_files" ] && patched_arg="--patched $patched_files"
          collateral_arg=""
          if [ -f reports/collateral.xml ]; then
            collateral_arg="--collateral reports/collateral.xml"
            [ -f reports/collateral_baseline.xml ] && collateral_arg="$collateral_arg --collateral-baseline reports/collateral_baseline.xml"
          fi
          # shellcheck disable=SC2086  # $baseline_files/$patched_arg/$collateral_arg MUST word-split into separate args
          serge-verify-verdict \
            --mode "$mode" \
            --nodeids "$nodeids" \
            --baseline $baseline_files \
            $patched_arg \
            $collateral_arg \
            --base-sha "$base_sha" --commit-sha "$commit_sha" --machine-type "$machine_type" \
            --out reports/verify-result.json || true
          cat reports/verify-result.json
          verdict=$(python3 -c "import json;print(json.load(open('reports/verify-result.json'))['verdict'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # The JSONL is the readout: this workflow has no OTel endpoint, so the
      # artifact is the transport. One row per test with cuda_delta_bytes and,
      # because the probe is on, cuda_delta_after_gc_bytes.
      - name: Upload memory probe
        if: ${{ always() && inputs.memory_probe }}
        uses: actions/upload-artifact@v7
        with:
          name: serge-memory-probe-${{ inputs.machine_type }}
          path: /transformers/reports/resource-metrics.jsonl
          if-no-files-found: warn

      - name: Upload verify result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: serge-verify-result-${{ inputs.machine_type }}
          path: /transformers/reports/verify-result.json
