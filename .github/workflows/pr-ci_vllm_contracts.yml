name: "[Reusable] vLLM model integration contracts"

# Runs the vLLM contracts against the Transformers checkout: each slim MIC fixture is
# served by vLLM's Transformers modeling backend (`model_impl="transformers"`) and
# compared with Transformers in the same process (backend picked, greedy tokens, logits
# at every step). They catch Transformers changes that break what the backend relies on
# (attention dispatch, kwargs, positions, weight names, config fields).
# The pins live in transformersci/contracts/data/vllm-fleet.json (`run-model-contracts --framework vllm`).
# Observational: failures are reported but do not block the PR.

on:
  workflow_call:
    inputs:
      docker_image:
        description: "Container image to run the job in"
        type: string
        required: true
      runner:
        description: "Runner group"
        type: string
        required: true
      ci_sha:
        description: "Revision of huggingface/transformers-ci containing the MIC runner and the vLLM fleet"
        type: string
        required: true

permissions:
  contents: read

jobs:
  run:
    # Infrastructure failures must not block PRs during the observational rollout.
    continue-on-error: true
    runs-on:
      group: ${{ inputs.runner }}
    timeout-minutes: 30
    container:
      image: ${{ inputs.docker_image }}
      options: "--shm-size=16gb"
    env:
      DOC_BUILDER_SHA: c69e96c087165ba49b1788e0c3464654dd60253c
      # Not the shared /mnt/cache: PR jobs mount it read-only.
      HF_HOME: /tmp/hf_home
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      # vLLM CPU backend: the slim fixtures need almost no KV cache (GiB).
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_TARGET_DEVICE: cpu

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install
        id: install
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$SECONDS
          # The latest vLLM nightly CPU wheel, and the torch version its requirements pin.
          path=$(curl -fsSL https://wheels.vllm.ai/nightly/cpu/vllm/metadata.json | python3 -c "
          import json, sys
          print(next(w for w in json.load(sys.stdin) if 'x86_64' in w['platform_tag'])['path'])")
          vllm_commit=$(echo "$path" | cut -d/ -f4)
          if [[ ! "$vllm_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not find the vLLM commit of the latest CPU wheel: $path"
            exit 1
          fi
          torch_version=$(curl -fsSL "https://raw.githubusercontent.com/vllm-project/vllm/$vllm_commit/requirements/cpu.txt" \
            | sed -nE 's/^torch==([0-9.]+)\+cpu.*/\1/p' | head -n 1)
          if [[ -z "$torch_version" ]]; then
            echo "::error::Could not find the torch==<version>+cpu pin in vLLM's requirements/cpu.txt at $vllm_commit"
            exit 1
          fi
          echo "vLLM $vllm_commit ($(basename "$path")), torch $torch_version"
          uv pip install "torch==$torch_version" torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          uv pip install "https://wheels.vllm.ai/$vllm_commit/$(basename "$path")" "torch==$torch_version" \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          uv pip install "transformers-ci[contracts,otel] @ git+https://github.com/huggingface/transformers-ci@${INPUTS_CI_SHA}"
          uv pip install jsonschema "git+https://github.com/huggingface/doc-builder@$DOC_BUILDER_SHA"
          # Last, so vLLM's own transformers requirement cannot replace the checkout under test.
          uv pip install --no-deps -e .
          echo "Installed in $((SECONDS - start)) s on $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"
        env:
          INPUTS_CI_SHA: ${{ inputs.ci_sha }}

      - name: Run the vLLM contracts
        id: run
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          export PYTHONPATH="$PWD/src"
          python - <<'PY_SOURCE'
          from pathlib import Path
          import torch, transformers, vllm
          expected = Path.cwd() / "src/transformers/__init__.py"
          actual = Path(transformers.__file__).resolve()
          assert actual == expected.resolve(), (actual, expected)
          print("Framework under test:", actual)
          print("vLLM", vllm.__version__, "| torch", torch.__version__)
          PY_SOURCE
          start=$SECONDS
          # Every contract with every variant it declares (default, plus e.g. an `images` / `audio` variant), on every event.
          run-model-contracts --framework vllm --fixtures-only --all-variants --output /tmp/results.jsonl 2> /tmp/run.log | python -c '
          import json, sys
          for line in sys.stdin:
              if not line.startswith("{"):
                  print(line.rstrip(), flush=True)
                  continue
              r = json.loads(line)
              print(r["status"].ljust(6), r["target"], r.get("variant", ""), r.get("platform", ""), "\n".join(r.get("failures", [])), flush=True)' || status=$?
          echo "$(tail -1 /tmp/run.log); $((SECONDS - start)) s"
          cat /tmp/run.log
          exit "${status:-0}"

      - name: Summary
        id: summary
        if: always()
        continue-on-error: true
        run: |
          touch /tmp/results.jsonl
          {
            echo "**Observational run:** failures do not block this PR."
            echo
            echo "Source: \`$GITHUB_SHA\`; event: \`$GITHUB_EVENT_NAME\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if command -v report-model-contracts >/dev/null 2>&1; then
            report-model-contracts /tmp/results.jsonl --log /tmp/run.log \
              >> "$GITHUB_STEP_SUMMARY" || \
              echo "Could not render the contract report; see the artifact and job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Contract runner was not installed; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        continue-on-error: true
        with:
          name: vllm-contracts
          path: |
            /tmp/results.jsonl
            /tmp/run.log

      - name: Flag contract failures for review
        if: always() && (steps.install.outcome == 'failure' || steps.run.outcome == 'failure' || steps.summary.outcome == 'failure')
        run: |
          echo "::warning::A vLLM model integration contract failed or could not run; see the job summary and artifact for details. This observation does not block the PR."
