name: "[Reusable] record-mic"

# Publish the expected values a Transformers PR's contracts job recorded for the cases its gate
# would block, for that PR only. Requested by someone with write access to the caller repository,
# with a `record-mic: <model> ...` PR comment or `make record-mic` (workflow_dispatch). The caller
# only forwards the request (as self-comment-ci.yml does for run-slow); everything that decides
# whether to act on it happens here. No job here runs the PR's code.
#
#   get-pr-info  the caller repository's own get-pr-info.yml: the one source of PR facts
#   authorize    parse the request (models are plain names); the requester has write access; the
#                PR is open; its merge commit is older than the request (the run-slow timestamp
#                check: code pushed after the request was not approved)
#   publish      the Hub write token: take the latest PR CI run that completed before the request
#                and tested exactly that merge commit, validate the record its contracts job left
#                in the `contracts` artifact (verified expected-value JSON for the requested
#                contracts only), commit it to `transformers-pr-<N>` branches of the mic repos,
#                write the fleet overlay `overlays/transformers-pr-<N>.json`, and post the diff
#   report       any failure: say why on the PR
#
# The PR's next contracts run applies the overlay (run-model-contracts --fleet-pr). Once the PR is
# merged or closed, mic-record-reconcile.yml (hourly) writes its overlay into the fleet or drops it.

on:
  workflow_call:
    inputs:
      pr:
        description: "Transformers PR number"
        type: string
        required: true
      request:
        description: "The request as written: a comment whose first line is `record-mic: <models>`"
        type: string
        required: true
      requested_by:
        description: "GitHub login that made the request"
        type: string
        required: true
      requested_at:
        description: "When it was made (ISO 8601; empty: now, for a workflow_dispatch)"
        type: string
        required: false
        default: ""
      ci_workflow:
        description: "Name of the caller's PR CI workflow, whose contracts job recorded the blocked cases"
        type: string
        required: false
        default: "PR CI"
      ci_sha:
        description: "Revision of huggingface/transformers-ci containing the MIC tools"
        type: string
        required: false
        default: "main"
    secrets:
      mic_write_token:
        description: "Hub token with write access to the huggingface-mic contract repos and fleet dataset"
        required: true

permissions:
  contents: read

jobs:
  get-pr-info:
    permissions:
      contents: read
    uses: huggingface/transformers/.github/workflows/get-pr-info.yml@main
    with:
      pr_number: ${{ inputs.pr }}

  authorize:
    needs: get-pr-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      models: ${{ steps.check.outputs.models }}
      requested_at: ${{ steps.check.outputs.requested_at }}
    steps:
      # Inputs reach the script only as environment variables, never interpolated into it.
      - name: Parse and authorize the request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          REQUEST: ${{ inputs.request }}
          USER_LOGIN: ${{ inputs.requested_by }}
          REQUESTED_AT: ${{ inputs.requested_at }}
          PR_STATE: ${{ fromJSON(needs.get-pr-info.outputs.PR).state }}
          MERGE_SHA: ${{ needs.get-pr-info.outputs.PR_MERGE_COMMIT_SHA }}
          MERGE_TIMESTAMP: ${{ needs.get-pr-info.outputs.PR_MERGE_COMMIT_TIMESTAMP }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number: $PR"; exit 1; }
          line=$(printf '%s\n' "$REQUEST" | head -1 | tr -d '\r')
          [[ "$line" == record-mic:* ]] || { echo "::error::the request must start with 'record-mic:'"; exit 1; }
          models=$(echo "${line#record-mic:}" | tr ',' ' ' | xargs)
          [[ -n "$models" && "$models" =~ ^[A-Za-z0-9_.\ -]+$ ]] || { echo "::error::record-mic: <model> [<model> ...] (plain names)"; exit 1; }
          permission=$(gh api "repos/$REPO/collaborators/$USER_LOGIN/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::$USER_LOGIN has '$permission' access to $REPO; record-mic needs write"; exit 1 ;;
          esac
          [[ "$PR_STATE" == open ]] || { echo "::error::PR #$PR is $PR_STATE"; exit 1; }
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GitHub has no merge commit for #$PR (conflicts?); ask again"; exit 1; }
          requested=${REQUESTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
          if [ "$(date -d "$requested" +%s)" -le "$MERGE_TIMESTAMP" ]; then
            echo "::error::#$PR changed after the request: code pushed later was not approved; ask again"
            exit 1
          fi
          { echo "models=$models"; echo "requested_at=$requested"; } >> "$GITHUB_OUTPUT"

  publish:
    needs: [get-pr-info, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # transformers-ci and the transformers-mic it pins; no Transformers checkout, no PR code.
      - name: Install
        env:
          INPUTS_CI_SHA: ${{ inputs.ci_sha }}
        run: pip install "transformers-ci[contracts] @ git+https://github.com/huggingface/transformers-ci@${INPUTS_CI_SHA}"

      # The latest PR CI run that completed before the request and whose contracts job tested the
      # verified merge commit: its record is what that run measured and showed as red.
      - name: Find the contracts run of the verified merge commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          WORKFLOW: ${{ inputs.ci_workflow }}
          HEAD_SHA: ${{ needs.get-pr-info.outputs.PR_HEAD_SHA }}
          MERGE_SHA: ${{ needs.get-pr-info.outputs.PR_MERGE_COMMIT_SHA }}
          REQUESTED_AT: ${{ needs.authorize.outputs.requested_at }}
        run: |
          before=$(date -d "$REQUESTED_AT" +%s)
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&status=completed&per_page=50" \
            --jq ".workflow_runs[] | select(.name == env.WORKFLOW) | \"\(.id) \(.updated_at)\"")
          while read -r id updated; do
            [[ -n "$id" ]] || continue
            [ "$(date -d "$updated" +%s)" -lt "$before" ] || continue
            rm -rf artifact
            gh run download "$id" --repo "$REPO" --name contracts --dir artifact 2>/dev/null || continue
            # The contracts job wrote what it tested; the record must be of the verified commit.
            if python -I - "$MERGE_SHA" "$PR" <<'PY'
          import json, sys
          o = json.load(open("artifact/contracts-observation.json"))
          sys.exit(0 if o.get("sha") == sys.argv[1] and str(o.get("pr")) == sys.argv[2] else 1)
          PY
            then
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              [ -f artifact/record-mic/record.json ] || {
                echo "::error::PR CI run $id tested this merge commit but recorded nothing: its contracts gate blocked no case"
                exit 1
              }
              exit 0
            fi
          done <<< "$runs"
          echo "::error::no completed PR CI run of the current merge commit finished before the request; wait for the contracts job, then ask again"
          exit 1

      - name: Publish
        id: publish
        env:
          HF_TOKEN: ${{ secrets.mic_write_token }}
          PR: ${{ inputs.pr }}
          BY: ${{ inputs.requested_by }}
          MODELS: ${{ needs.authorize.outputs.models }}
          MERGE_SHA: ${{ needs.get-pr-info.outputs.PR_MERGE_COMMIT_SHA }}
        run: |
          python -I -m transformers_mic.pr_record publish --pr "$PR" --record artifact/record-mic \
            --models "$MODELS" --merge-sha "$MERGE_SHA" --by "$BY" --execute

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BY: ${{ inputs.requested_by }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          {
            echo "**record-mic** (asked by @$BY): published for this PR only, from PR CI run $RUN_ID. They apply from the next contracts run."
            echo
            python -I -c "import json; from transformers_mic import pr_record; print(pr_record.summary(json.load(open('artifact/record-mic/record.json'))))"
          } > comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md

  report:
    needs: [get-pr-info, authorize, publish]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Say why on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BY: ${{ inputs.requested_by }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || exit 0
          gh pr comment "$PR" --repo "$REPO" --body "**record-mic** (asked by @$BY): nothing was published; the reason is in the [run]($RUN)."
