{{- if .Values.backups.enabled }}
{{- if not .Values.backups.repository }}
{{- fail "backups.repository is required when backups.enabled=true" }}
{{- end }}
{{- $backupServiceAccountName := .Values.backups.serviceAccountName }}
{{- if .Values.backups.serviceAccount.create }}
{{- $backupServiceAccountName = (.Values.backups.serviceAccount.name | default (printf "%s-backup" .Release.Name)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $backupServiceAccountName }}
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with .Values.backups.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range .Values.backups.targets }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-{{ .name }}
  namespace: {{ include "transformers-ci.namespace" $ }}
  labels:
    {{- include "transformers-ci.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backup
    app.kubernetes.io/backup-target: {{ .name | quote }}
spec:
  schedule: {{ $.Values.backups.schedule | quote }}
  concurrencyPolicy: {{ $.Values.backups.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $.Values.backups.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.backups.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ $.Values.backups.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "transformers-ci.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: backup
            app.kubernetes.io/backup-target: {{ .name | quote }}
        spec:
          restartPolicy: OnFailure
          {{- with $backupServiceAccountName }}
          serviceAccountName: {{ . }}
          {{- end }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "transformers-ci.selectorLabels" $ | nindent 22 }}
                      app.kubernetes.io/component: {{ .component }}
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - name: aws-credentials
              image: "{{ $.Values.backups.awsCredentials.image.repository }}:{{ $.Values.backups.awsCredentials.image.tag }}"
              imagePullPolicy: {{ $.Values.backups.awsCredentials.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  aws configure export-credentials --format env > /aws-credentials/env
              resources:
                {{- toYaml $.Values.backups.awsCredentials.resources | nindent 16 }}
              volumeMounts:
                - name: aws-credentials
                  mountPath: /aws-credentials
          containers:
            - name: restic
              image: "{{ $.Values.backups.image.repository }}:{{ $.Values.backups.image.tag }}"
              imagePullPolicy: {{ $.Values.backups.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  . /aws-credentials/env
                  restic snapshots >/dev/null || restic init
                  restic backup {{ .path }} \
                    --host {{ include "transformers-ci.namespace" $ }} \
                    --tag transformers-ci \
                    --tag {{ .name }}
                  restic forget \
                    --host {{ include "transformers-ci.namespace" $ }} \
                    --tag {{ .name }} \
                    --keep-daily 7 \
                    --prune
              env:
                - name: RESTIC_REPOSITORY
                  value: "{{ $.Values.backups.repository }}/{{ .name }}"
                - name: RESTIC_CACHE_DIR
                  value: /.cache/restic
              envFrom:
                - secretRef:
                    name: {{ $.Values.backups.existingSecret }}
              resources:
                {{- toYaml $.Values.backups.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ .path }}
                  readOnly: true
                - name: cache
                  mountPath: /.cache/restic
                - name: aws-credentials
                  mountPath: /aws-credentials
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .pvcName }}
            - name: cache
              emptyDir:
                sizeLimit: {{ $.Values.backups.restoreCache.sizeLimit }}
            - name: aws-credentials
              emptyDir:
                medium: Memory
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.backups.networkPolicy.allowHttpsEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-s3-egress
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  podSelector:
    matchLabels:
      {{- include "transformers-ci.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backup
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
