---
# Tempo ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    usage_report:
      reporting_enabled: false

    # Bound search memory. Scanning blocks to answer /api/search is the main driver
    # of Tempo's RAM spikes (the exporter polls a 1h window every render; the
    # publisher searches 24h). Defaults (1000 concurrent jobs, unbounded duration)
    # let a single wide search balloon the heap toward the memory limit and time out
    # every other query. Cap the search range (the publisher needs 24h, so allow
    # 26h) and the per-search parallelism; slightly slower searches, far flatter
    # memory.
    query_frontend:
      search:
        max_duration: 26h
        concurrent_jobs: 200

    # Per-trace span budget. A sharded CI job emits ONE trace per shard with 10k+
    # spans; at ~2.6 KB/span a shard trace is ~20-45 MB. Tempo's default
    # max_bytes_per_trace is 5 MB, which silently dropped ~70% of every shard's
    # spans (tempo_discarded_spans_total{reason="trace_too_large"} ran into the
    # tens of millions) and capped each shard at ~1,880 tests in the dashboards —
    # so a run that really ran ~52k tests showed ~15k. Raise it to match the
    # 64 MiB OTLP body limit set on the distributor below so whole shard traces
    # persist. (Bigger live traces cost ingester RAM — watch Tempo RSS vs its
    # GOMEMLIMIT / 16Gi limit; lower this or raise the limit if it climbs.)
    #
    # 2026-06-25: with the producer span-id collision fixed (commit 011834c), a
    # shard trace now keeps ~100k DISTINCT spans instead of collapsing to ~6k —
    # ~16x more live data in the ingester, which pushed RSS to ~7.7 GiB and
    # OOM-restarted Tempo ~8x/6h at the old 8Gi limit. Mitigation: 8Gi→16Gi limit
    # (goMemLimit ~85%) AND max_block_duration 5m→2m below, so the ingester cuts
    # blocks to disk sooner and holds less live data at peak.
    overrides:
      defaults:
        global:
          max_bytes_per_trace: 67108864  # 64 MiB (was 5 MB default)

    server:
      http_listen_port: 3200
      log_level: info
      # Read-path message size (frontend's RECEIVE side of the querier→frontend
      # hop). INGESTION was raised to 64 MiB (max_bytes_per_trace + the OTLP body
      # limits below), but the READ path kept Tempo's 16 MiB gRPC default. See the
      # querier.frontend_worker note below for the full failure mode; the frontend
      # must be able to RECEIVE the 64 MiB response the querier now sends.
      grpc_server_max_recv_msg_size: 67108864  # 64 MiB (was 16 MiB default)
      grpc_server_max_send_msg_size: 67108864  # 64 MiB (was 16 MiB default)

    querier:
      frontend_worker:
        # SEND side of the querier→frontend hop — the ACTUAL trace-by-id read cap.
        # The querier assembles a whole trace and sends it to the query-frontend in
        # ONE gRPC message over this client; Tempo defaults max_send_msg_size to
        # 16 MiB (while max_recv_msg_size already defaults to 100 MiB), so any trace
        # over 16 MiB fails `GET /api/traces/{id}` with HTTP 500 "response larger
        # than the max (N vs 16777216)". Post span-id-collision-fix a tests_torch
        # shard trace is ~36 MB / ~100k spans, so EVERY fetch of the biggest job
        # 500'd — the exporter silently dropped it from the run store AND the
        # Prometheus rollup, so tests_torch vanished from the Jobs table for large
        # runs (~27k trace-by-id 500s/24h ≈ 17% of reads). Raise to the 64 MiB
        # ingestion ceiling so whole shard traces read back. NOTE: buffers the full
        # trace in querier/frontend RAM per read — watch Tempo RSS; the durable fix
        # is smaller per-shard traces (see docs/plan-large-trace-read-limit-2026-07-03.md).
        grpc_client_config:
          max_send_msg_size: 67108864  # 64 MiB (was 16 MiB default)
          max_recv_msg_size: 67108864  # 64 MiB (default is already 100 MiB; pin for symmetry)

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              max_recv_msg_size_mib: 64
            http:
              endpoint: 0.0.0.0:4318
              # CI run traces can be 8 MB+ (10k+ spans per shard). Raise the OTLP
              # body limit well above Tempo's 4 MiB default so whole traces ingest.
              max_request_body_size: 67108864  # 64 MiB

    ingester:
      # 2m (was 5m): cut blocks to disk sooner so the ingester holds less live
      # trace data at peak. A CI shard trace spans ~5-6 min and now carries ~100k
      # spans post-collision-fix; flushing more often trades a few more (smaller)
      # blocks for a flatter memory profile. See max_bytes_per_trace note above.
      max_block_duration: 2m

    compactor:
      compaction:
        # 2160h = 90d, matched to Prometheus retention and the run store so a PR's
        # traces (tracebacks + the trace/span view) stay available for the FULL
        # retention window — not just 14d. Without this, run/job/PR stats (Prom)
        # and the per-run test list (run store) survived 90d but tracebacks aged
        # out at 14d. Empirically Tempo retains ~1.2 GB/day net (post-compaction;
        # the ~3.66 GB/day flush rate compresses down), so 90d ≈ ~105 GB; the PVC
        # is sized to 350 GiB to also cover the flush-rate worst case (~310 GB)
        # plus headroom. ebs-gp3 resizes online, but the StatefulSet
        # volumeClaimTemplate is immutable on update — growing the live PVC needs
        # `kubectl patch pvc data-tempo-0` and the STS recreated (--cascade=orphan)
        # so this template's new size applies. See docs/capacity-and-retention-plan-2026-06-25.md.
        block_retention: 2160h

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
---
# Tempo StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      {{- include "transformers-ci.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tempo
  template:
    metadata:
      labels:
        {{- include "transformers-ci.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tempo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3200"
    spec:
      nodeSelector:
        role-tempo: "true"
      securityContext:
        fsGroup: 1000
      containers:
        - name: tempo
          image: "{{ .Values.tempo.image.repository }}:{{ .Values.tempo.image.tag }}"
          imagePullPolicy: {{ .Values.tempo.image.pullPolicy }}
          command:
            - "/tempo"
            - "-config.file=/etc/tempo/tempo.yaml"
          env:
            - name: GOMEMLIMIT
              value: "{{ .Values.tempo.goMemLimit }}"
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "transformers-ci.labels" . | nindent 10 }}
          app.kubernetes.io/component: tempo
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.tempo.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.tempo.storage.size }}
---
# Tempo Service
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  selector:
    {{- include "transformers-ci.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
