{{- if and .Values.secrets.create .Values.externalSecret.enabled }}
{{- fail "secrets.create and externalSecret.enabled cannot both be true" }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
#------------------------------------------------------------------------------
# External secret-management resource
#
# The chart keeps this provider-neutral. Supply apiVersion, kind, and spec from
# private deployment values for the secret-management operator used in your
# environment.
#------------------------------------------------------------------------------
apiVersion: {{ required "externalSecret.apiVersion is required when externalSecret.enabled=true" .Values.externalSecret.apiVersion }}
kind: {{ required "externalSecret.kind is required when externalSecret.enabled=true" .Values.externalSecret.kind }}
metadata:
  name: {{ default .Values.secrets.name .Values.externalSecret.name }}
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
spec:
{{- tpl (toYaml .Values.externalSecret.spec) . | nindent 2 }}
{{- end }}
{{- if .Values.secrets.create }}
---
#------------------------------------------------------------------------------
# Placeholder Kubernetes Secret
#
# For production deployments, disable this resource and provide an existing
# Secret with the configured key names through your preferred secret-management
# mechanism.
#------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secrets.keys.traceApiKey }}: {{ .Values.secrets.placeholder.traceApiKey | default "placeholder" | b64enc | quote }}
  {{ .Values.secrets.keys.grafanaAdminPassword }}: {{ .Values.secrets.placeholder.grafanaAdminPassword | default "admin" | b64enc | quote }}
  {{ .Values.secrets.keys.githubToken }}: {{ .Values.secrets.placeholder.githubToken | default "" | b64enc | quote }}
  {{ .Values.secrets.keys.hfToken }}: {{ .Values.secrets.placeholder.hfToken | default "" | b64enc | quote }}
{{- end }}
