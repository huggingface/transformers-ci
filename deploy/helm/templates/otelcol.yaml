{{- define "otelcol-configmap" }}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth:
    token: ${TRACE_API_KEY}
  # Disk-backed buffer for the otlp/tempo sending_queue so an undelivered backlog
  # survives a collector container restart (its dominant failure is its own OOM,
  # after which the same pod's emptyDir is still there). Full durability across a
  # pod reschedule/redeploy would need a PVC (StatefulSet) — tracked as a follow-up.
  file_storage/queue:
    directory: /var/lib/otelcol/queue

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: {{ .Values.otelcol.receivers.otlp.grpc.endpoint }}
      http:
        endpoint: {{ .Values.otelcol.receivers.otlp.http.endpoint }}
        auth:
          authenticator: bearertokenauth

processors:
  # Cap heap so a burst can't OOM-kill the collector (which would drop every
  # in-flight span). check_interval must be < the GC interval; limits sit under
  # the 2Gi container limit so the limiter trips before the kernel does.
  memory_limiter:
    check_interval: 1s
    limit_mib: 1700
    spike_limit_mib: 400
  batch:
    # Larger batches to Tempo cut per-request overhead under a multi-million-span
    # burst. send_batch_max_size stays within Tempo's 64 MiB OTLP body limit.
    send_batch_size: 8192
    send_batch_max_size: 16384
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    # Single-replica Tempo can be slow to ack a large block-building push; give
    # the leg a generous timeout and a deep on-disk-free queue so a momentary
    # Tempo stall buffers in the collector instead of backpressuring the receiver
    # and timing out the runner's export.
    timeout: 30s
    sending_queue:
      enabled: true
      # Disk-backed so the buffered backlog survives a collector restart too — not
      # just a Tempo restart. Without this the queue is in-memory and an OOM/redeploy
      # of the collector silently drops everything in flight to Tempo.
      storage: file_storage/queue
      queue_size: 10000
      num_consumers: 10
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      # NEVER give up on a retryable error (e.g. Tempo OOM-restarting and returning
      # "connection refused"). The old 120s cap dropped the batch permanently once
      # Tempo was down >2min — and a Tempo OOM crashloop runs ~130s, right at that
      # edge, so a slightly longer restart silently lost spans despite export
      # SUCCESS. retry_on_failure only retries *retryable* errors, so a permanent
      # reject (e.g. trace_too_large) still fails fast and won't wedge. The safety
      # valve against unbounded buffering is memory_limiter, which backpressures the
      # receiver (a visible runner-side export failure) rather than dropping silently.
      max_elapsed_time: 0

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8889
  extensions: [health_check, bearertokenauth, file_storage/queue]
  pipelines:
    traces:
      receivers: [otlp]
      # memory_limiter must be first so it sheds load before the batcher buffers
      # it; batch last so whole batches are shipped to Tempo.
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
data:
  config.yaml: |
{{ include "otelcol-configmap" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
spec:
  replicas: {{ .Values.otelcol.replicas }}
  selector:
    matchLabels:
      {{- include "transformers-ci.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otelcol
  template:
    metadata:
      labels:
        {{- include "transformers-ci.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otelcol
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        checksum/config: {{ include "otelcol-configmap" . | sha256sum }}
    spec:
      containers:
        - name: otelcol
          image: "{{ .Values.otelcol.image.repository }}:{{ .Values.otelcol.image.tag }}"
          imagePullPolicy: {{ .Values.otelcol.image.pullPolicy }}
          command:
            - /otelcol-contrib
            - --config=/conf/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8889
              protocol: TCP
          resources:
            {{- toYaml .Values.otelcol.resources | nindent 12 }}
          env:
            - name: TRACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.keys.traceApiKey }}
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: queue
              mountPath: /var/lib/otelcol/queue
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otelcol-config
        # Survives container OOM-restart within the same pod (not pod reschedule).
        - name: queue
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otelcol
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8889
      targetPort: 8889
      protocol: TCP
  selector:
    {{- include "transformers-ci.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
