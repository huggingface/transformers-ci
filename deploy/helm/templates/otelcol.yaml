{{- define "otelcol-configmap" }}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth:
    token: ${TRACE_API_KEY}
  # Disk-backed buffer for the otlp/tempo sending_queue so an undelivered backlog
  # survives a collector container restart (its dominant failure is its own OOM,
  # after which the same pod's emptyDir is still there). Full durability across a
  # pod reschedule/redeploy would need a PVC (StatefulSet) — tracked as a follow-up.
  file_storage/queue:
    directory: /var/lib/otelcol/queue

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: {{ .Values.otelcol.receivers.otlp.grpc.endpoint }}
      http:
        endpoint: {{ .Values.otelcol.receivers.otlp.http.endpoint }}
        auth:
          authenticator: bearertokenauth

processors:
  # Cap heap so a burst can't OOM-kill the collector (which would drop every
  # in-flight span). check_interval must be < the GC interval; limits sit under
  # the 2Gi container limit so the limiter trips before the kernel does.
  memory_limiter:
    check_interval: 1s
    limit_mib: 1700
    spike_limit_mib: 400
  batch:
    # Larger batches to Tempo cut per-request overhead under a multi-million-span
    # burst. send_batch_max_size stays within Tempo's 64 MiB OTLP body limit.
    send_batch_size: 8192
    send_batch_max_size: 16384
    timeout: 5s
{{- if .Values.otelcol.repositoryFilter.internalOwners }}
  # Repository privacy boundary. Every clone of huggingface/transformers inherits
  # the CI workflow AND the OTLP bearer token, so a PRIVATE clone inside our own
  # org exports its runs here by default and they surface on the PUBLIC dashboard
  # — repository name, PR titles, commit SHAs, test names and stack traces. The
  # token cannot tell the repos apart, so the boundary is enforced on the resource
  # attribute the runner sets from GITHUB_REPOSITORY.
  #
  # Targeted deny, not a blanket allow: drop a repository owned by an internal
  # owner UNLESS it is one of the known-public ones. Contributors work on forks,
  # and a fork of a public repo is itself always public on GitHub, so anything
  # outside our own org is kept. Only we can hold a private clone.
  #
  # A resource with no vcs.repository.name at all makes IsMatch error, which
  # error_mode: ignore treats as "condition did not match" — so unattributed
  # spans are KEPT. That is deliberate: a trace we cannot attribute is not one we
  # can attribute to our own org, and local/dev runs legitimately lack the tag.
  #
  # filterprocessor DROPS a span when a condition is true, so this reads as
  # "internally owned and not known-public".
  filter/repository_privacy:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(resource.attributes["vcs.repository.name"], "^({{ join "|" .Values.otelcol.repositoryFilter.internalOwners }})/"){{ range .Values.otelcol.repositoryFilter.publicRepositories }} and resource.attributes["vcs.repository.name"] != "{{ . }}"{{ end }}'
{{- end }}
{{- if .Values.otelcol.liveCounts.enabled }}
  # Live test counts branch (fed by forward/live, so after the privacy filter;
  # the fan-out clones each batch for it, so Tempo's data is untouched).
  filter/live_test_spans:
    error_mode: ignore
    traces:
      span:
        - 'attributes["pytest.span_type"] != "test"'
  # Shape spans for spanmetrics, which keys series on service.name + span name +
  # dimensions (span attributes only) and holds them per resource:
  # - the span name is the test node id, so replace it or it is one series per test;
  # - the resource becomes just the run (plus the service.name spanmetrics
  #   requires, or it skips the span), so each run is one entry in the connector's
  #   resource cache and old runs are evicted from it. Without that every run's
  #   series is re-exported until the pod restarts (0.96 has no metrics_expiration).
  transform/live_keys:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["test_job"], resource.attributes["transformers.test.job"])
          - set(attributes["hardware"], resource.attributes["transformers.test.hardware"])
          # Same fallback as the exporter's hardware_from_job(), so live and final
          # series join on identical labels.
          - set(attributes["hardware"], "gpu") where attributes["hardware"] == nil and IsMatch(attributes["test_job"], "gpu")
          - set(attributes["hardware"], "cpu") where attributes["hardware"] == nil
          - set(name, "test")
      - context: resource
        statements:
          - set(attributes["run_id"], attributes["transformers.test.run.id"])
          - keep_keys(attributes, ["run_id"])
          - set(attributes["service.name"], "otelcol-live")
{{- end }}

{{- if .Values.otelcol.liveCounts.enabled }}

connectors:
  forward/live: {}
  # ci_live_calls_total{run_id, test_job, hardware, status_code}: a cumulative
  # count of the test spans this replica received. Not the `count` connector: in
  # 0.96 its deltas are replaced, not summed, by the prometheus exporter, which
  # undercounted a 196k-test run by a third.
  spanmetrics:
    namespace: ci_live
    histogram:
      disable: true
    exclude_dimensions: ['span.kind', 'span.name', 'service.name']
    dimensions:
      - name: test_job
      - name: hardware
    # Runs held (and re-exported every flush), least recently updated evicted
    # first. An active run evicted by newer ones restarts from 0, so keep this well
    # above the runs in flight at once (peak 11 PR CI runs on 2026-09-24).
    resource_metrics_cache_size: {{ .Values.otelcol.liveCounts.runsHeld }}
    metrics_flush_interval: 5s
{{- end }}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    # Single-replica Tempo can be slow to ack a large block-building push; give
    # the leg a generous timeout and a deep on-disk-free queue so a momentary
    # Tempo stall buffers in the collector instead of backpressuring the receiver
    # and timing out the runner's export.
    timeout: 30s
    sending_queue:
      enabled: true
      # Disk-backed so the buffered backlog survives a collector restart too — not
      # just a Tempo restart. Without this the queue is in-memory and an OOM/redeploy
      # of the collector silently drops everything in flight to Tempo.
      storage: file_storage/queue
      queue_size: 10000
      num_consumers: 10
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      # NEVER give up on a retryable error (e.g. Tempo OOM-restarting and returning
      # "connection refused"). The old 120s cap dropped the batch permanently once
      # Tempo was down >2min — and a Tempo OOM crashloop runs ~130s, right at that
      # edge, so a slightly longer restart silently lost spans despite export
      # SUCCESS. retry_on_failure only retries *retryable* errors, so a permanent
      # reject (e.g. trace_too_large) still fails fast and won't wedge. The safety
      # valve against unbounded buffering is memory_limiter, which backpressures the
      # receiver (a visible runner-side export failure) rather than dropping silently.
      max_elapsed_time: 0
{{- if .Values.otelcol.liveCounts.enabled }}
  prometheus/live:
    endpoint: 0.0.0.0:{{ .Values.otelcol.liveCounts.port }}
    # Evicted runs stop being updated; drop them from /metrics after this.
    metric_expiration: {{ .Values.otelcol.liveCounts.metricExpiration }}
    # run_id lives on the resource (see transform/live_keys): make it a label.
    resource_to_telemetry_conversion:
      enabled: true
{{- end }}

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8889
  extensions: [health_check, bearertokenauth, file_storage/queue]
  pipelines:
    traces:
      receivers: [otlp]
      # memory_limiter must be first so it sheds load before the batcher buffers
      # it; batch last so whole batches are shipped to Tempo. The allow-list sits
      # between them: after the limiter (so shedding still happens first) and
      # before the batcher (so rejected spans never occupy queue or disk).
      processors: [memory_limiter, {{ if .Values.otelcol.repositoryFilter.internalOwners }}filter/repository_privacy, {{ end }}batch]
      exporters: [otlp/tempo{{ if .Values.otelcol.liveCounts.enabled }}, forward/live{{ end }}]
{{- if .Values.otelcol.liveCounts.enabled }}
    traces/live:
      receivers: [forward/live]
      processors: [filter/live_test_spans, transform/live_keys]
      exporters: [spanmetrics]
    metrics/live:
      receivers: [spanmetrics]
      exporters: [prometheus/live]
{{- end }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
data:
  config.yaml: |
{{ include "otelcol-configmap" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
spec:
  replicas: {{ .Values.otelcol.replicas }}
  selector:
    matchLabels:
      {{- include "transformers-ci.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otelcol
  template:
    metadata:
      labels:
        {{- include "transformers-ci.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otelcol
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        checksum/config: {{ include "otelcol-configmap" . | sha256sum }}
    spec:
      containers:
        - name: otelcol
          image: "{{ .Values.otelcol.image.repository }}:{{ .Values.otelcol.image.tag }}"
          imagePullPolicy: {{ .Values.otelcol.image.pullPolicy }}
          command:
            - /otelcol-contrib
            - --config=/conf/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8889
              protocol: TCP
            {{- if .Values.otelcol.liveCounts.enabled }}
            - name: live-metrics
              containerPort: {{ .Values.otelcol.liveCounts.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.otelcol.resources | nindent 12 }}
          env:
            - name: TRACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.keys.traceApiKey }}
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: queue
              mountPath: /var/lib/otelcol/queue
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otelcol-config
        # Survives container OOM-restart within the same pod (not pod reschedule).
        - name: queue
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otelcol
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8889
      targetPort: 8889
      protocol: TCP
  selector:
    {{- include "transformers-ci.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
