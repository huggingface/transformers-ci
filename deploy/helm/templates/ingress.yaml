#------------------------------------------------------------------------------
# Ingress for OTLP Trace Ingestion
# Receives OTLP traces from CI jobs and forwards to OpenTelemetry Collector
#------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otelcol
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: otelcol
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ index .Values.ingress.traces.annotations "alb.ingress.kubernetes.io/scheme" }}
    alb.ingress.kubernetes.io/target-type: {{ index .Values.ingress.traces.annotations "alb.ingress.kubernetes.io/target-type" }}
    alb.ingress.kubernetes.io/listen-ports: {{ index .Values.ingress.traces.annotations "alb.ingress.kubernetes.io/listen-ports" | quote }}
    alb.ingress.kubernetes.io/group.name: {{ index .Values.ingress.traces.annotations "alb.ingress.kubernetes.io/group.name" }}
    {{- if .Values.ingress.traces.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.traces.certificateArn }}
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-path: /
    external-dns.alpha.kubernetes.io/hostname: {{ index .Values.ingress.traces.annotations "external-dns.alpha.kubernetes.io/hostname" }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.traces.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otelcol
                port:
                  number: 4318
---
#------------------------------------------------------------------------------
# Ingress for Grafana Dashboard
# Public-facing endpoint for read-only Grafana access
#------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ index .Values.ingress.grafana.annotations "alb.ingress.kubernetes.io/scheme" }}
    alb.ingress.kubernetes.io/target-type: {{ index .Values.ingress.grafana.annotations "alb.ingress.kubernetes.io/target-type" }}
    alb.ingress.kubernetes.io/listen-ports: {{ index .Values.ingress.grafana.annotations "alb.ingress.kubernetes.io/listen-ports" | quote }}
    alb.ingress.kubernetes.io/group.name: {{ index .Values.ingress.grafana.annotations "alb.ingress.kubernetes.io/group.name" }}
    {{- with index .Values.ingress.grafana.annotations "alb.ingress.kubernetes.io/load-balancer-name" }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ . }}
    {{- end }}
    {{- if .Values.ingress.grafana.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.grafana.certificateArn }}
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    external-dns.alpha.kubernetes.io/hostname: {{ index .Values.ingress.grafana.annotations "external-dns.alpha.kubernetes.io/hostname" }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.grafana.domain }}
      http:
        paths:
          # Route trace-exporter helper endpoints before the Grafana catch-all.
          # /failure serves traceback HTML; /run serves the per-run test table
          # (both embedded as iframes in dashboards); /pr-search is the "Find a PR" box
          # every dashboard mounts in Grafana's top bar; /page-view counts the
          # dashboard views its loader panel reports; /related-issues and
          # /serge-actions are the Test page's Summary and actions; /badge and
          # /summary serve PR status integrations.
          - path: /failure
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /related-issues
            pathType: Exact
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /serge-actions
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /rerun-failed
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /run
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /pr-search
            pathType: Exact
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /patch-view
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /page-view
            pathType: Exact
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /badge
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          - path: /summary
            pathType: Prefix
            backend:
              service:
                name: trace-exporter
                port:
                  number: 8000
          {{- if .Values.ciGithubStatus.enabled }}
          # GitHub webhook deliveries. Exact: the service's /metrics and /healthz
          # stay in-cluster. Every delivery is signature-checked before parsing.
          - path: /webhook
            pathType: Exact
            backend:
              service:
                name: ci-github-status
                port:
                  number: {{ .Values.ciGithubStatus.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
{{- if .Values.ingress.grafanaLegacy.enabled }}
---
# Keep existing links working on the old ALB without forwarding traffic to Grafana.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-legacy-redirect
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ index .Values.ingress.grafanaLegacy.annotations "alb.ingress.kubernetes.io/scheme" }}
    alb.ingress.kubernetes.io/target-type: {{ index .Values.ingress.grafanaLegacy.annotations "alb.ingress.kubernetes.io/target-type" }}
    alb.ingress.kubernetes.io/listen-ports: {{ index .Values.ingress.grafanaLegacy.annotations "alb.ingress.kubernetes.io/listen-ports" | quote }}
    alb.ingress.kubernetes.io/group.name: {{ index .Values.ingress.grafanaLegacy.annotations "alb.ingress.kubernetes.io/group.name" }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.grafanaLegacy.certificateArn }}
    alb.ingress.kubernetes.io/actions.redirect-to-grafana: {{ dict "type" "redirect" "redirectConfig" (dict "protocol" "HTTPS" "port" "443" "host" .Values.ingress.grafana.domain "path" "/#{path}" "query" "#{query}" "statusCode" "HTTP_301") | toJson | quote }}
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.grafanaLegacy.domain }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.grafanaLegacy.domain }}
      http:
        paths:
          {{- if and .Values.ingress.grafanaLegacy.forwardWebhook .Values.ciGithubStatus.enabled }}
          # GitHub sends POST /webhook to the old URL until its registration moves.
          - path: /webhook
            pathType: Exact
            backend:
              service:
                name: ci-github-status
                port:
                  number: {{ .Values.ciGithubStatus.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-to-grafana
                port:
                  name: use-annotation
{{- end }}
