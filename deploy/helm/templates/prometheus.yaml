{{- define "transformers-ci.prometheus-recording-rules" -}}
groups:
  - name: slowest_tests_main
    # The per-test pytest_test_duration_seconds metric is high-cardinality, so
    # scanning it over a long window is slow (a 90d ad-hoc query timed out the
    # "Slowest Tests By Average Duration" panel at ~30s). Precompute the top 20
    # here on a slow cadence; the dashboard reads this 20-series result instantly.
    #
    # Split by device. Accelerator jobs dominate on raw duration: once the rule
    # had a full 7 days of data the combined top 20 was 100% `run_models_gpu`
    # (2026-07-28: 303-1695s, vs ~165s for the slowest CPU test), which buried
    # every actionable CPU test in one shared list. Two rules -> two panels, and
    # the slow-test triage reads the CPU one (it can only reproduce CPU work on
    # its CPU timing lane).
    #
    # `_GPU_JOBS` below must stay in sync with DEFAULT_EXCLUDE_JOBS in
    # src/transformersci/agentic/slowest_main_triage.py. Any job naming a GPU,
    # plus the FSDP and tensor-parallel jobs which are multi-accelerator by
    # definition.
    interval: 15m
    rules:
      - record: pytest_test:duration_avg_main_cpu:top20_7d
        expr: topk(20, avg by (test_nodeid, test_job, test_module, test_class, test_function) (last_over_time(pytest_main_test_duration_seconds{pr="main", test_job!~".*gpu.*|tests_fsdp_ci|tests_tensor_parallel_ci"}[7d])))
      - record: pytest_test:duration_avg_main_gpu:top20_7d
        expr: topk(20, avg by (test_nodeid, test_job, test_module, test_class, test_function) (last_over_time(pytest_main_test_duration_seconds{pr="main", test_job=~".*gpu.*|tests_fsdp_ci|tests_tensor_parallel_ci"}[7d])))
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ include "transformers-ci.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/recording_rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # CI-data Prometheus: only scrapes pytest_trace_exporter. Long retention
      # (90d) preserves a quarter of CI history.
      - job_name: 'trace-exporter'
        # The exporter renders synchronously inside the scrape: a cache-miss runs a
        # ~5s Tempo search and builds a large payload, which blew past the default
        # 5s scrape timeout. Give the scrape room; 30s also matches the dashboard
        # refresh and cuts Tempo query load.
        scrape_interval: 30s
        scrape_timeout: 25s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ include "transformers-ci.namespace" . }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: trace-exporter
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: {{ .Values.traceExporter.config.port | quote }}
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          # Pin `instance` to a constant. The exporter is a singleton renderer of
          # the GLOBAL CI snapshot, not per-pod data, so the default per-pod IP
          # instance label is wrong: every rollout minted a new instance and its
          # series lingered for the 90d retention, so dashboard sum()/count()
          # double-counted across dead pods. A constant instance makes a
          # replacement pod continue the same series instead of forking a new one.
          - target_label: instance
            replacement: trace-exporter

      # Infrastructure metrics: observability stack itself (tempo, grafana,
      # otelcol). These are high-cardinality but the single Prometheus in k8s
      # handles both CI and infra metrics (unlike docker-compose which splits
      # to preserve disk budget on VM hosts).
      - job_name: 'tempo'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ include "transformers-ci.namespace" . }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: tempo
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "3200"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "tempo_(request|response)_message_bytes_bucket"
            action: drop
          - source_labels: [__name__]
            regex: "tempo_kv_request_duration_seconds_bucket"
            action: drop

      - job_name: 'grafana'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ include "transformers-ci.namespace" . }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: grafana
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "3000"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "grafana_feature_toggles_info"
            action: drop
          - source_labels: [__name__]
            regex: "grafana_http_request_duration_seconds_bucket"
            action: drop

      - job_name: 'otelcol-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ include "transformers-ci.namespace" . }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: otelcol
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8889"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2

{{- if .Values.sergeScrape.enabled }}
      # serge's own per-job agent-loop metrics. serge is a different release in
      # a different namespace, and this is the durable side of its numbers: its
      # /metrics is a rolling window over the 25 jobs its store keeps (~2 days),
      # so without something scraping them out, no change to serge's agent loop
      # can be shown to have helped.
      #
      # A static Service target, not kubernetes_sd: serge is one Deployment
      # behind one Service, so discovery would buy only per-pod labels we
      # discard anyway (see the `instance` pin below) at the cost of granting
      # this ServiceAccount pod-list in another namespace. The cluster-boundary
      # NetworkPolicy already permits this: the ClusterIP is inside the
      # service CIDR in networkPolicy.allowedCIDRs.
      - job_name: 'serge'
        metrics_path: /metrics
        scrape_interval: {{ .Values.sergeScrape.interval }}
        static_configs:
          - targets: [{{ .Values.sergeScrape.target | quote }}]
        relabel_configs:
          # Same reasoning as trace-exporter: these series describe *jobs*, not
          # the pod that reported them, so a per-pod instance label would fork
          # every series on each serge rollout and leave the dead ones lingering
          # for the full 90d retention.
          - target_label: instance
            replacement: serge
        metric_relabel_configs:
          # This Prometheus backs a PUBLIC Grafana, and an anonymous viewer can
          # query any datasource directly through /api/datasources/proxy — so a
          # restricted folder or a hidden panel is not a boundary; whatever lands
          # here is published. serge is authorized per repo and can be pointed at
          # a private one, so the repo identity is collapsed to `other` unless it
          # is on the allow-list. The counters still arrive, so the aggregate
          # ("how many sessions ended on a guard") stays complete and honest —
          # only the name of a repo we have not declared public is dropped.
          # Same principle as the ingest-side deny rule on vcs.repository.name.
          #
          # Every rule below is scoped to serge_job_info by matching __name__.
          # Only that series carries repo/pr/number; on the value series the
          # source label is absent, which reads as "not allow-listed" and would
          # otherwise *add* repo="other" to every counter — a label that forks
          # the series and breaks the job_id join the table depends on.
          - source_labels: [repo]
            regex: {{ .Values.sergeScrape.publicRepos | quote }}
            action: replace
            target_label: __serge_public
            replacement: "yes"
          - source_labels: [__name__, __serge_public]
            regex: "serge_job_info;"
            action: replace
            target_label: repo
            replacement: other
          # A PR number is as identifying as the repo name once you know serge
          # only reviews one org, so it goes with it. An empty replacement
          # removes the label outright.
          - source_labels: [__name__, __serge_public]
            regex: "serge_job_info;"
            action: replace
            target_label: pr
            replacement: ""
          - source_labels: [__name__, __serge_public]
            regex: "serge_job_info;"
            action: replace
            target_label: number
            replacement: ""
          # metric_relabel_configs does NOT drop __-prefixed labels the way
          # target relabeling does, so the marker has to go explicitly — else
          # allow-listed series carry it and non-allow-listed ones do not.
          - action: labeldrop
            regex: __serge_public
{{- end }}

      - job_name: 'backup-status-exporter'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ include "transformers-ci.namespace" . }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: backup-status-exporter
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: {{ .Values.backupStatus.port | quote }}
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
  recording_rules.yml: |
{{ include "transformers-ci.prometheus-recording-rules" . | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "transformers-ci.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "transformers-ci.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/recording-rules: {{ include "transformers-ci.prometheus-recording-rules" . | sha256sum }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ['sh', '-c', 'chmod 777 /prometheus']
          volumeMounts:
            - name: storage
              mountPath: /prometheus
          securityContext:
            runAsUser: 0
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle
            {{- if .Values.prometheus.enableAdminApi }}
            # Admin TSDB API (delete_series / clean_tombstones). OFF by default and
            # meant to be switched on only for the length of a deliberate purge,
            # then switched back off — it is the one API that can destroy history.
            # Grafana refuses to proxy non-allow-listed POSTs to a Prometheus
            # datasource, so this is not reachable from the anonymous dashboard,
            # and the Service is ClusterIP with no ingress. The reason to keep it
            # off is the accident, not the attacker.
            - --web.enable-admin-api
            {{- end }}
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.prometheus.storage.storageClass }}
        storageClassName: {{ .Values.prometheus.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.prometheus.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "transformers-ci.namespace" . }}
  labels:
    {{- include "transformers-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    {{- include "transformers-ci.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
