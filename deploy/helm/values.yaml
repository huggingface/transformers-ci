#------------------------------------------------------------------------------
# Default values for transformers-ci
# These can be overridden with an environment-specific values file.
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# Namespace
#------------------------------------------------------------------------------
namespace:
  name: transformers-ci
  labels:
    app.kubernetes.io/name: transformers-ci
    app.kubernetes.io/part-of: open-source

#------------------------------------------------------------------------------
# Ingress Configuration
# Provide deployment-specific domains and certificate ARNs in a private values file.
#------------------------------------------------------------------------------
ingress:
  traces:
    domain: traces.example.com
    certificateArn: ""
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/load-balancer-name: transformers-ci-traces
      alb.ingress.kubernetes.io/group.name: transformers-ci-public
      external-dns.alpha.kubernetes.io/hostname: traces.example.com

  grafana:
    domain: grafana.example.com
    certificateArn: ""
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/load-balancer-name: transformers-ci-grafana
      alb.ingress.kubernetes.io/group.name: transformers-ci-public
      external-dns.alpha.kubernetes.io/hostname: grafana.example.com

#------------------------------------------------------------------------------
# OpenTelemetry Collector
#------------------------------------------------------------------------------
otelcol:
  # 3 replicas (behind the ingress) so a sharded run's burst — 64 worker
  # processes flushing full batches at once — spreads across more receivers
  # instead of timing out a single congested collector (the dominant cause of the
  # span-undercount; see docs/investigation-undercount-large-traces-2026-06-24.md).
  replicas: 3
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.96.0"
    pullPolicy: IfNotPresent

  # Headroom for the burst: a 512Mi/1Gi collector under a multi-million-span flush
  # spends its time in GC and acks slowly, which backpressures the receiver and
  # times out the runner's export. More memory + CPU keeps acks fast.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  receivers:
    otlp:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  service:
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [tempo]

#------------------------------------------------------------------------------
# Grafana Tempo (trace storage backend)
#------------------------------------------------------------------------------
tempo:
  image:
    repository: grafana/tempo
    tag: "2.10.5"
    pullPolicy: IfNotPresent

  # Go soft-memory limit so Tempo's GC runs hard as it approaches the cap
  # instead of growing to the cgroup mem limit and getting OOM-killed.
  # Keep this below the memory limit — ~85% of the container limit.
  # NOTE: was 1750MiB (85% of an OLD 2Gi limit) while the limit was already 4Gi —
  # it throttled GC to 1.75G while live data still grew to 4G and OOM-killed Tempo,
  # losing acked-but-unflushed spans on SIGKILL (the ~69% "silent" span drop).
  # A sharded run holds many wide live traces at once (≤64MiB each), so give Tempo
  # real headroom; the tempo node has 31GiB and is only lightly requested.
  # 2026-06-25: bumped 6800MiB→13600MiB alongside the 8Gi→16Gi limit below. The
  # producer span-id collision fix (011834c) made each shard trace keep ~100k
  # distinct spans (~16x more live data) — RSS peaked ~7.7 GiB and OOM-restarted
  # Tempo ~8x/6h at 8Gi. See templates/tempo.yaml ingester note.
  goMemLimit: "13600MiB"  # ~85% of the 16Gi limit

  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 16Gi

  storage:
    enabled: true
    # 90d of traces at ~1.2 GB/day net (~105 GB), sized to 350 GiB to also cover
    # the flush-rate worst case (~310 GB) + headroom. Matches block_retention 90d
    # and Prometheus/run-store retention so a PR's tracebacks last the full window.
    # NOTE: the StatefulSet volumeClaimTemplate is immutable on update — the live
    # data-tempo-0 PVC was grown with `kubectl patch` and the STS recreated with
    # --cascade=orphan so this size applies. See templates/tempo.yaml.
    size: 350Gi
    storageClass: ebs-gp3

#------------------------------------------------------------------------------
# pytest-trace-exporter
#------------------------------------------------------------------------------
traceExporter:
  replicas: 1
  # Set to a commit SHA or other source identifier to trigger a rollout when
  # source code changes but the rendered Deployment would otherwise be unchanged.
  sourceRevision: ""
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent

  tempo:
    url: http://tempo:3200

  config:
    limit: 100
    fetchConcurrency: 4
    # 20s: span_pruning (one span per test) shrank shard traces from ~40-65 MB to
    # ~7 MB, which fetch in <1s. The 45s band-aid (needed while legacy large traces
    # were still in-window) is dialled back to 20s — ample for small traces plus a
    # margin for the last legacy stragglers aging out of the lookback window.
    httpTimeout: 20
    refreshSlowSeconds: 30
    refreshCooldownSeconds: 60
    # Keep the trace cache >= limit so a full lookback window stays warm and the
    # render stops re-fetching/re-parsing traces from Tempo every cycle.
    traceCacheMax: 256
    # Quoted: Helm parses large bare ints as float64 and emits scientific
    # notation (2.68e+08), which the exporter's int parser rejects.
    traceCacheMaxBytes: "268435456"  # 256Mi serialized (~1GiB resident at 4x overhead)
    # 60s (was 120s): a run's rollup (Jobs table, run totals) emits after this
    # quiet gap following the last trace. A run's shards arrive continuously, so a
    # 60s gap still reliably means "done" — this just makes run-level stats appear
    # ~1 min sooner. Snappier GitHub→dashboard lag without churn.
    traceSettleSeconds: 60
    # How often a still-in-flight (unsettled) trace is re-read from Tempo. MUST be
    # comfortably ABOVE the render duration: a render re-fetches every cached trace
    # whose last fetch is older than this, so if it is <= the render period the
    # exporter re-reads the whole window every cycle and render time spirals
    # (15s -> 120s+). Decoupled from traceSettleSeconds for exactly this reason —
    # at 300s, after one cold-start render each cycle only fetches newly-arrived
    # traces and serves the rest from cache, holding render duration at ~1-8s.
    # In-flight test counts then lag by up to this interval, which is fine: run
    # roll-ups settle post-completion and Prometheus retains the per-test series.
    # Kept comfortably ABOVE the render yet below 1h/2 (1800s) so an in-flight
    # shard is re-read several times before it can age out of the window (too long
    # risks a shard's next re-read falling past the lookback, freezing its roll-up
    # at a partial count).
    # 300s: with span_pruning shrinking traces to ~7 MB, re-reading in-flight
    # traces is cheap again, so the 900s band-aid (added when giant-trace downloads
    # spiralled render to ~330s) is restored to 300s. Only UNSETTLED traces are
    # re-fetched at this cadence (settled ones serve from cache), and post-fix
    # in-flight traces are small — so this halves in-progress test-count lag
    # (15 min → 5 min) without render risk. Still above render, below lookback/2.
    traceRefetchSeconds: 300
    # Soft RSS ceiling. Sized to ~85% of the 2Gi container limit (was 560, sized
    # for the retired 640MiB docker box, which forced premature cache drops).
    memSoftMb: 1740
    lookback: 1h
    prometheusUrl: http://prometheus:9090
    port: 8000
    serviceName: pytest-observability

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  # Persistent store for per-run test rows. The render loop already reconstructs
  # each run's complete test set for the rollups; persisting those slim rows lets
  # the /run drill-down serve them directly over the whole retention window
  # instead of re-searching Tempo on demand (Tempo search is capped at a 26h
  # window and re-fetching a large sharded run's traces per view is slow).
  #
  # retentionDays MUST match the Prometheus retention (90d) above: a PR open for
  # months must still surface its early runs' test lists. The run/job/PR *stats*
  # live in Prometheus (90d); this store holds the per-run *test list* and is the
  # only thing that keeps that drill-down alive once Tempo's 14d traces age out.
  # Slim rows are tiny vs full traces, so 90d here is cheap (unlike Tempo at 90d).
  # NOTE: tracebacks / the trace view (served from Tempo via /failure) remain
  # bounded by Tempo's block_retention (14d) — only the test list reaches 90d.
  runStore:
    enabled: true
    size: 30Gi
    storageClass: ebs-gp3
    path: /var/run-store
    retentionDays: 90

#------------------------------------------------------------------------------
# Prometheus
#------------------------------------------------------------------------------
prometheus:
  image:
    repository: prom/prometheus
    tag: "v3.0.1"
    pullPolicy: IfNotPresent

  retention: "90d"

  storage:
    enabled: true
    # 90d at the post-cardinality-fix rate (~0.5–0.77 GB/day → ~45–70 GB worst
    # case) + TSDB compaction/WAL headroom. Live PVC grown via `kubectl patch`
    # + STS recreated (--cascade=orphan) since volumeClaimTemplates are immutable.
    size: 100Gi
    storageClass: ebs-gp3

  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    # 8Gi: the head holds the exporter's high-cardinality per-test series; 4Gi
    # OOM-killed during WAL replay on startup and crashlooped. Root fix is
    # reducing that cardinality.
    limits:
      memory: 8Gi

  scrapeInterval: 15s

#------------------------------------------------------------------------------
# Grafana
#------------------------------------------------------------------------------
grafana:
  # Single replica: Grafana unified alerting on the default (ephemeral SQLite)
  # store has no cross-replica notification dedup, so 2 replicas double-send every
  # alert email. One replica = correct alerting; dashboards stay reachable behind
  # the ALB across the brief restart. (For HA alerting instead, configure
  # [unified_alerting.ha] gossip + a shared DB and raise this back to 2.)
  replicas: 1
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent

  # Alert-notification email via Amazon SES (us-east-1). user/password are SES SMTP
  # credentials (NOT AWS access keys) synced from Infisical; fromAddress must be a
  # verified SES identity. Toggle `enabled` on once the secret + sender are ready.
  smtp:
    enabled: false
    host: email-smtp.us-east-1.amazonaws.com:587
    fromAddress: ""
    fromName: "transformers-ci Grafana"
    startTLSPolicy: MandatoryStartTLS
    # SES SMTP credentials live in a STANDALONE Secret created out-of-band (no
    # Infisical needed), e.g.:
    #   kubectl -n transformers-ci create secret generic transformers-ci-smtp \
    #     --from-literal=ses-smtp-user=AKIA... \
    #     --from-literal=ses-smtp-password='<SES SMTP password>'
    # It is NOT managed by the Infisical operator, so it persists across resyncs.
    existingSecret: transformers-ci-smtp
    userKey: ses-smtp-user
    passwordKey: ses-smtp-password
  alerting:
    # Recipient(s) for the provisioned pod-health + ci-publisher alerts
    # (comma-separated for multiple).
    emailTo: ""

  auth:
    anonymous:
      enabled: true
      orgRole: Viewer
    disableLoginForm: false
    adminPassword: ""
    # GitHub OAuth login (an ADDITIONAL login method — an identity layer, not the
    # security boundary). Disabled by default; the chart renders and deploys
    # unchanged until you enable it. Turn on ONLY after (1) a GitHub OAuth App
    # exists and (2) its client secret is in the secret store under
    # secrets.keys.githubOauthClientSecret — enabling without the secret present
    # makes the Grafana pod fail to start (missing secretKeyRef). Keep
    # auth.anonymous.enabled true so the public read-only dashboards + datasource
    # proxy keep working.
    # Login is hardcoded to members of the `huggingface` GitHub org
    # (allowed_organizations in the rendered grafana.ini) — not configurable here.
    github:
      enabled: false
      # Config, not a credential — safe to set in tracked values.
      clientId: ""
      # Let huggingface-org members create their Grafana account on first login.
      allowSignUp: true

  domain: grafana.example.com

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  dashboards:
    enabled: true
    files:
      - pytest-observability-dashboard.json
      - pytest-observability-job-dashboard.json
      - pytest-observability-pr-dashboard.json
      - pytest-observability-run-dashboard.json
      - pytest-observability-daily-dashboard.json
      - pytest-test-dashboard.json
      - pytest-test-health-dashboard.json
      - pytest-observability-stack-health.json
    # Dashboards provisioned into a separate folder that can be access-restricted.
    # Empty by default (all dashboards public). A private deployment moves a
    # dashboard here AND removes it from `files` above. The folder is auto-created;
    # its Viewer permission is stripped post-deploy by
    # deploy/scripts/grafana-restrict-folder.py so only authenticated members see it.
    # Must NOT match any dashboard title — Grafana looks up the provider folder by
    # title and errors ("expected folder, found dashboard") on a collision.
    restrictedFolder: "Restricted"
    restrictedFiles: []

#------------------------------------------------------------------------------
# CI Data Publisher
# CronJob that publishes Tempo traces as Parquet partitions to an HF bucket.
# Disabled by default; enable in private deployment values after configuring credentials.
#------------------------------------------------------------------------------
ciDataPublisher:
  enabled: false
  schedule: "0 * * * *" # hourly, matching docker-compose crontab
  # Set to a commit SHA or other source identifier to update the CronJob pod
  # template when source code changes.
  sourceRevision: ""
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent

  tempoUrl: http://tempo:3200

  config:
    serviceNames: "pytest-observability,pytest-observability-demo"
    bucketUri: "hf://buckets/<namespace>/<bucket-name>"
    window: "24h"
    limit: 5000
    # The 24h /api/search is the heaviest Tempo call; give the batch job longer
    # than the interactive exporter's 10s default.
    httpTimeout: 30
    # Disable in-process trace memoization so each run streams traces without
    # retaining them in memory (mirrors PYTEST_TRACE_EXPORTER_TRACE_SETTLE_SECONDS
    # in docker-compose.yml).
    traceSettleSeconds: 999999999999

  staging:
    sizeLimit: 10Gi

  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      memory: 4Gi

#------------------------------------------------------------------------------
# PVC backups
# Daily Restic backups to S3 with 7 daily snapshots retained per target.
# Credentials stay outside values: `existingSecret` must provide RESTIC_PASSWORD
# and either AWS_* credentials or the pod must use an IAM-bound service account.
#------------------------------------------------------------------------------
backups:
  enabled: false
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  image:
    repository: restic/restic
    tag: "0.17.3"
    pullPolicy: IfNotPresent
  # Example: s3:s3.amazonaws.com/my-bucket/transformers-ci
  repository: ""
  existingSecret: transformers-ci-backup
  externalSecret:
    enabled: false
    # Optional; defaults to backups.existingSecret when empty.
    name: ""
    apiVersion: ""
    kind: ""
    spec: {}
  serviceAccount:
    create: false
    # Defaults to "<release>-backup" when empty and create=true.
    name: ""
    annotations: {}
  # Existing ServiceAccount to use when serviceAccount.create=false.
  serviceAccountName: ""
  restoreCache:
    sizeLimit: 1Gi
  networkPolicy:
    # When the chart-level NetworkPolicy is enabled, backup pods need external
    # HTTPS egress for S3-compatible endpoints, STS, and KMS. This policy selects
    # only backup pods; the broader release pods keep the cluster-boundary policy.
    allowHttpsEgress: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  targets:
    - name: tempo
      pvcName: data-tempo-0
      path: /var/tempo
      component: tempo
    - name: prometheus
      pvcName: storage-prometheus-0
      path: /prometheus
      component: prometheus
    - name: trace-exporter-run-store
      pvcName: trace-exporter-run-store
      path: /var/run-store
      component: trace-exporter

#------------------------------------------------------------------------------
# Backup status exporter
# Scrapes Kubernetes CronJob/Job status for backup jobs and exposes Prometheus
# metrics used by the CI Health dashboard.
#------------------------------------------------------------------------------
backupStatus:
  enabled: false
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  port: 8090
  # Namespace names to monitor. The chart creates read-only RoleBindings in each
  # listed namespace for the exporter ServiceAccount.
  namespaces:
    - transformers-ci
    - serge
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

#------------------------------------------------------------------------------
# Network Policies
# Disabled by default. Enable in private deployment values to constrain chart pods
# to the cluster/VPC address space and reduce blast radius from public endpoints.
#------------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # CIDRs that this release may receive traffic from and connect to. Set these to
  # the deployment's pod/VPC and Kubernetes service CIDRs to prevent egress to
  # other clusters or public networks if a public-facing pod is compromised.
  allowedCIDRs: []
  # Allow selected pods to resolve Kubernetes service names through kube-system DNS.
  allowDNS: true
  # Also allow pod-to-pod traffic inside this Helm release via podSelector. This
  # keeps internal traffic working on CNIs where ipBlock matching pod IPs differs.
  allowSameReleasePods: true
  # Additional raw NetworkPolicy ingress rule entries, rendered under spec.ingress.
  extraIngress: []
  # Additional raw NetworkPolicy egress rule entries, rendered under spec.egress.
  # Use sparingly for required external dependencies such as runtime source/package
  # downloads or publishing endpoints; standard NetworkPolicy only supports CIDRs,
  # not DNS names.
  extraEgress: []

#------------------------------------------------------------------------------
# Secrets
# For production deployments, set create=false and provide this Secret through
# your preferred secret-management mechanism.
#------------------------------------------------------------------------------
secrets:
  name: transformers-ci-secrets
  create: true
  keys:
    traceApiKey: trace-api-key
    grafanaAdminPassword: grafana-admin-password
    githubToken: gh-token
    hfToken: hf-token
    # Grafana GitHub-OAuth client secret. Only consumed when
    # grafana.auth.github.enabled is true.
    githubOauthClientSecret: grafana-github-oauth-client-secret
  placeholder:
    # Only used when secrets.create is true
    traceApiKey: ""
    grafanaAdminPassword: ""
    githubToken: ""
    hfToken: ""
    githubOauthClientSecret: ""

#------------------------------------------------------------------------------
# External Secret Resource
# Disabled by default. Private deployment values can enable this to let Helm
# manage a provider-specific secret-sync CRD without committing provider details.
#------------------------------------------------------------------------------
externalSecret:
  enabled: false
  # Optional; defaults to secrets.name when empty.
  name: ""
  apiVersion: ""
  kind: ""
  spec: {}
