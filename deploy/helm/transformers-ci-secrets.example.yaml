# transformers-ci-secrets — sensitive runtime values for the observability stack.
# The chart references this Secret by name through `secrets.name`
# (default: transformers-ci-secrets) when `secrets.create: false`.
#
# The key names below MUST match `secrets.keys.*` in values.yaml:
#   traceApiKey          -> trace-api-key           (OTLP ingestion auth)
#   grafanaAdminPassword -> grafana-admin-password
#   githubToken          -> gh-token                (GitHub metadata API)
#   hfToken              -> hf-token                 (ci-data-publisher upload)
#
# Usage: copy to transformers-ci-secrets.yaml (git-ignored), fill in the
# values, then:
#   deploy/scripts/deploy.sh -n transformers-ci \
#     --secret-file deploy/helm/transformers-ci-secrets.yaml
# Do NOT commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: transformers-ci-secrets
  # namespace: <namespace>   # or pass -n <namespace> to kubectl apply
type: Opaque
stringData:
  # --- OTLP ingestion auth (required: rejects unauthenticated trace pushes) ---
  trace-api-key: "replace-me"

  # --- Grafana admin password (login form / admin API; anonymous viewers
  #     do not need it) ---
  grafana-admin-password: "replace-me"

  # --- GitHub API token for metadata queries. Without it PR/commit metadata
  #     lookups run unauthenticated (60 req/hr) and dashboard metadata renders blank.
  #     A fine-grained read-only token on the target repo is enough. ---
  gh-token: "ghp_or_github_pat_..."

  # --- Hugging Face token for the ci-data-publisher to upload trace-derived
  #     datasets to the configured bucket. Omit if ciDataPublisher.enabled=false. ---
  hf-token: "hf_..."
