global:
  # Infrastructure Prometheus: scrapes the observability stack itself
  # (tempo, grafana, cadvisor, node_exporter, and both Prometheus instances).
  # 15s scrape + 14d retention keeps disk usage modest despite ~4000+ series.
  # The Stack Health dashboard queries this datasource via uid prometheus-infra.
  scrape_interval: 15s

scrape_configs:
  # Scrape both Prometheus instances so the Stack Health dashboard can show
  # TSDB stats / scrape latency for each.
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: prometheus-infra
    static_configs:
      - targets: ["prometheus-infra:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "tempo_(request|response)_message_bytes_bucket"
        action: drop
      - source_labels: [__name__]
        regex: "tempo_kv_request_duration_seconds_bucket"
        action: drop

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "grafana_feature_toggles_info"
        action: drop
      - source_labels: [__name__]
        regex: "grafana_http_request_duration_seconds_bucket"
        action: drop

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]
