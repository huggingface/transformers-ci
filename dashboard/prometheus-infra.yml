global:
  # Infrastructure Prometheus: scrapes the observability stack itself
  # (tempo, grafana, cadvisor, node_exporter, and both Prometheus instances).
  # The Stack Health dashboard queries this datasource via uid prometheus-infra.
  #
  # 60s scrape: these are slow-moving infra gauges (CPU/mem/disk/ingest), so the
  # dashboard's rate(...[5m]) / increase(...[24h]) queries don't need fine
  # resolution. At ~4700 series this is ~6.8M samples/day — a 4x cut from the
  # old 15s interval (~27M/day), which dominated total ingest. 14d retention.
  scrape_interval: 60s

scrape_configs:
  # Scrape both Prometheus instances so the Stack Health dashboard can show
  # TSDB stats / scrape latency for each.
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: prometheus-infra
    static_configs:
      - targets: ["prometheus-infra:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "tempo_(request|response)_message_bytes_bucket"
        action: drop
      - source_labels: [__name__]
        regex: "tempo_kv_request_duration_seconds_bucket"
        action: drop

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "grafana_feature_toggles_info"
        action: drop
      - source_labels: [__name__]
        regex: "grafana_http_request_duration_seconds_bucket"
        action: drop

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]
