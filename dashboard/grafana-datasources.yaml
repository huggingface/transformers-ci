apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    isDefault: true
    jsonData:
      # Let trace links resolve a test failure's run/PR metadata back to the
      # Prometheus-backed dashboards.
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
