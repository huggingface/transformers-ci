apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus

  # Stack-health Prometheus (14d retention). The Stack Health dashboard
  # queries this datasource; CI dashboards keep using the main `prometheus`.
  - name: Prometheus Infra
    type: prometheus
    access: proxy
    url: http://prometheus-infra:9090
    uid: prometheus-infra

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    isDefault: true
    jsonData:
      # Let trace links resolve a test failure's run/PR metadata back to the
      # Prometheus-backed dashboards.
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
