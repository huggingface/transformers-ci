services:
  tempo:
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    user: root
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # No healthcheck: the grafana/tempo image is distroless (no shell, wget, or
    # curl), so an in-container HTTP probe can't run. The trace exporter already
    # tolerates Tempo being briefly unavailable on startup (emits _up 0).
    ports:
      # Host-facing OTLP endpoints — unchanged from the otelcol setup so
      # clients keep sending to 5317 (gRPC) / 5318 (HTTP).
      - "5317:4317"
      - "5318:4318"
      # Tempo query/API (replaces the old Jaeger UI on 16687).
      - "3200:3200"

  pytest-trace-exporter:
    image: python:3.12-slim
    restart: unless-stopped
    command:
      - "python"
      - "-m"
      - "transformersci.otel.trace_exporter"
    environment:
      - PYTHONPATH=/app/src
      - PYTEST_TRACE_EXPORTER_TEMPO_URL=http://tempo:3200
      - PYTEST_TRACE_EXPORTER_LIMIT=200
      - PYTEST_TRACE_EXPORTER_LOOKBACK=1h
      - PYTEST_TRACE_EXPORTER_PORT=8000
      - PYTEST_RESOURCE_METRICS_FILE=/data/pytest-resource-metrics.jsonl
      - PYTEST_TRACE_EXPORTER_SERVICE_NAME=pytest-observability-demo
    volumes:
      - ../src:/app/src:ro
      - ./data:/data
    depends_on:
      - tempo
    ports:
      # Serves /metrics (scraped by Prometheus) and /failure?trace_id=... — a
      # readable HTML traceback page the test dashboard embeds in an iframe.
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - pytest-trace-exporter
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # The per-test dashboard embeds the exporter's /failure traceback page via
      # an <iframe> in a Text panel; the default sanitizer would strip it.
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/pytest-observability-dashboard.json
    volumes:
      - ./pytest-observability-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-dashboard.json:ro
      - ./pytest-observability-job-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-job-dashboard.json:ro
      - ./pytest-observability-pr-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-pr-dashboard.json:ro
      - ./pytest-observability-run-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-run-dashboard.json:ro
      - ./pytest-test-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-test-dashboard.json:ro
      - ./grafana-dashboard.yaml:/etc/grafana/provisioning/dashboards/grafana-dashboard.yaml:ro
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
    ports:
      - "3000:3000"

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
