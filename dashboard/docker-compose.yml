# Resource caps are parameterized so the same compose file works on any VM
# size. Defaults below fit a t3.medium (4 GB / 2 vCPU). For other sizes, set
# the env vars (or drop a .env next to this file) — deploy.sh computes them
# automatically from the AWS describe-instance-types response.
services:
  tempo:
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    user: root
    mem_limit: ${TEMPO_MEM_LIMIT:-1200m}
    cpus: ${TEMPO_CPUS:-0.70}
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # No healthcheck: the grafana/tempo image is distroless (no shell, wget, or
    # curl), so an in-container HTTP probe can't run. The trace exporter already
    # tolerates Tempo being briefly unavailable on startup (emits _up 0).
    ports:
      # Host-facing OTLP endpoints — unchanged from the otelcol setup so
      # clients keep sending to 5317 (gRPC) / 5318 (HTTP).
      - "5317:4317"
      - "5318:4318"
      # Tempo query/API (replaces the old Jaeger UI on 16687).
      - "3200:3200"

  pytest-trace-exporter:
    image: python:3.12-slim
    restart: unless-stopped
    mem_limit: ${EXPORTER_MEM_LIMIT:-768m}
    cpus: ${EXPORTER_CPUS:-0.30}
    command:
      - "python"
      - "-m"
      - "transformersci.otel.trace_exporter"
    environment:
      - PYTHONPATH=/app/src
      - PYTEST_TRACE_EXPORTER_TEMPO_URL=http://tempo:3200
      - PYTEST_TRACE_EXPORTER_LIMIT=${PYTEST_TRACE_EXPORTER_LIMIT:-200}
      - PYTEST_TRACE_EXPORTER_LOOKBACK=${PYTEST_TRACE_EXPORTER_LOOKBACK:-1h}
      - PYTEST_TRACE_EXPORTER_PORT=8000
      - PYTEST_RESOURCE_METRICS_FILE=/data/pytest-resource-metrics.jsonl
      - PYTEST_TRACE_EXPORTER_SERVICE_NAME=pytest-observability-demo
    volumes:
      - ../src:/app/src:ro
      - ./data:/data
    depends_on:
      - tempo
    ports:
      # Serves /metrics (scraped by Prometheus) and /failure?trace_id=... — a
      # readable HTML traceback page the test dashboard embeds in an iframe.
      - "8000:8000"

  # CI-data Prometheus: 90d retention, scrapes only pytest_trace_exporter.
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPUS:-0.20}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - pytest-trace-exporter
    ports:
      - "9091:9090"

  # Infrastructure Prometheus: 14d retention, scrapes the observability stack
  # itself (tempo, grafana, cadvisor, node_exporter, and both prom instances).
  # Kept separate from the CI prometheus so high-cardinality infra series
  # don't eat the 90d disk budget reserved for CI history.
  prometheus-infra:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_INFRA_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_INFRA_CPUS:-0.30}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.external-url=http://localhost:9092"
    volumes:
      - ./prometheus-infra.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-infra-data:/prometheus
    ports:
      - "9092:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-640m}
    cpus: ${GRAFANA_CPUS:-0.30}
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # The per-test dashboard embeds the exporter's /failure traceback page via
      # an <iframe> in a Text panel; the default sanitizer would strip it.
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/pytest-observability-dashboard.json
    volumes:
      - ./pytest-observability-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-dashboard.json:ro
      - ./pytest-observability-job-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-job-dashboard.json:ro
      - ./pytest-observability-pr-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-pr-dashboard.json:ro
      - ./pytest-observability-run-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-run-dashboard.json:ro
      - ./pytest-test-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-test-dashboard.json:ro
      - ./pytest-observability-stack-health.json:/etc/grafana/provisioning/dashboards/pytest-observability-stack-health.json:ro
      - ./grafana-dashboard.yaml:/etc/grafana/provisioning/dashboards/grafana-dashboard.yaml:ro
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus

  # Container-level metrics (CPU/mem/network/disk I/O per service) — scraped
  # by Prometheus and rendered by the Stack Health dashboard.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    mem_limit: ${CADVISOR_MEM_LIMIT:-256m}
    cpus: ${CADVISOR_CPUS:-0.15}
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      # Drop metric families we never chart. Each disabled group removes
      # dozens to hundreds of series (e.g. percpu emits per-core counters
      # × per-container, which dominates the cardinality on multi-core hosts).
      - "--disable_metrics=advtcp,tcp,udp,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,percpu,diskIO"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  # Host-level metrics (disk usage, load, filesystem, network) for the EC2 box
  # itself. Mounts the host rootfs read-only and exposes /metrics on :9100.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-128m}
    cpus: ${NODE_EXPORTER_CPUS:-0.10}
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Publishes the CI telemetry to a PUBLIC HF bucket on an hourly cron. Reads
  # raw traces from Tempo, shapes them into daily-partitioned Parquet (+ the raw
  # trace JSON), and `hf sync`s the staging volume to the bucket. Needs pyarrow
  # + the hf CLI + cron, so it builds its own image (the exporter is stdlib-only
  # and can't host this). App code is bind-mounted from ../src like the exporter.
  #
  # Requires HF_TOKEN (write scope on the bucket) in dashboard/.env — it is a
  # secret and is deliberately NOT written by deploy.sh.
  ci-data-publisher:
    build: ./ci-data-publisher
    restart: unless-stopped
    # Traces are streamed (one at a time) so memory is roughly the largest day's
    # rows + its Parquet table, not the whole window of raw traces. 1g is ample
    # headroom; the earlier 768m OOM was from materialising all traces at once.
    mem_limit: ${PUBLISHER_MEM_LIMIT:-1024m}
    cpus: ${PUBLISHER_CPUS:-0.30}
    environment:
      - PYTHONPATH=/app/src
      - PYTEST_TRACE_EXPORTER_TEMPO_URL=http://tempo:3200
      # Disable get_trace()'s in-process trace memoization. That cache exists for
      # the live exporter's repeated scrapes, but here it would retain every
      # (large) trace in the window and defeat streaming — it OOM'd the sidecar.
      # A huge settle window means no trace is ever "settled enough" to cache.
      - PYTEST_TRACE_EXPORTER_TRACE_SETTLE_SECONDS=999999999999
      # Publish every emitter's traces: real CI (pytest-observability) plus the
      # demo / sample-run name (pytest-observability-demo).
      - PUBLISH_SERVICE_NAMES=${PUBLISH_SERVICE_NAMES:-pytest-observability,pytest-observability-demo}
      - HF_BUCKET_URI=${HF_BUCKET_URI:-hf://buckets/huggingface/transformers-ci-telemetry}
      - HF_TOKEN=${HF_TOKEN:-}
      - PUBLISH_STAGING_DIR=/staging
      - PUBLISH_WINDOW=${PUBLISH_WINDOW:-48h}
      - PUBLISH_LIMIT=${PUBLISH_LIMIT:-5000}
    volumes:
      - ../src:/app/src:ro
      - ci-publisher-data:/staging
    depends_on:
      - tempo

  # Front-door reverse proxy so Grafana and the exporter are reachable on the
  # same origin. The /failure traceback iframe in pytest-test-dashboard needs
  # this — the public hostname only forwards one port, so the exporter has to
  # live behind the same hostname under a path prefix.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${PROXY_MEM_LIMIT:-192m}
    cpus: ${PROXY_CPUS:-0.15}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
      - pytest-trace-exporter
    ports:
      - "3000:80"

volumes:
  caddy-data:
  caddy-config:
  tempo-data:
  prometheus-data:
  prometheus-infra-data:
  grafana-data:
  # Staging mirror of the HF bucket; the publisher writes daily partitions here
  # and `hf sync`s it. Persisted so day partitions outside the publish window
  # are kept and not re-derived (the bucket is the long-term archive).
  ci-publisher-data:
