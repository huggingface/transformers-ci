services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    # run as root so badger can create /badger/{data,key} in the named volume,
    # which is created with root ownership on first mount
    user: "0"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - BADGER_SPAN_STORE_TTL=2160h
    volumes:
      - jaeger-data:/badger
    ports:
      - "16687:16686"

  pytest-trace-exporter:
    image: python:3.12-slim
    command:
      - "python"
      - "-m"
      - "transformersci.otel.trace_exporter"
    environment:
      - PYTHONPATH=/app/src
      - PYTEST_TRACE_EXPORTER_JAEGER_URL=http://jaeger:16686
      - PYTEST_TRACE_EXPORTER_LIMIT=200
      - PYTEST_TRACE_EXPORTER_LOOKBACK=1h
      - PYTEST_TRACE_EXPORTER_PORT=8000
      - PYTEST_RESOURCE_METRICS_FILE=/data/pytest-resource-metrics.jsonl
      - PYTEST_TRACE_EXPORTER_SERVICE_NAME=pytest-observability-demo
    volumes:
      - ../src:/app/src
      - ./data:/data
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - pytest-trace-exporter
    ports:
      - "9091:9090"

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml
    depends_on:
      - jaeger
    ports:
      - "5317:4317"
      - "5318:4318"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/pytest-observability-dashboard.json
    volumes:
      - ./pytest-observability-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-dashboard.json
      - ./pytest-observability-suite-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-suite-dashboard.json
      - ./pytest-observability-pr-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-pr-dashboard.json
      - ./pytest-observability-run-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-observability-run-dashboard.json
      - ./pytest-traceback-dashboard.json:/etc/grafana/provisioning/dashboards/pytest-traceback-dashboard.json
      - ./grafana-dashboard.yaml:/etc/grafana/provisioning/dashboards/grafana-dashboard.yaml
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana-data:/var/lib/grafana
    depends_on:
      - jaeger
      - prometheus
    ports:
      - "3000:3000"

volumes:
  jaeger-data:
  prometheus-data:
  grafana-data:
