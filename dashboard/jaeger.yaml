service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: os_main
    # http/grpc default to 0.0.0.0:16686 and 0.0.0.0:16685.
    # The legacy /api/traces query API the pytest trace exporter uses is
    # served on 16686 by this extension.

  jaeger_storage:
    backends:
      os_main:
        opensearch:
          server_urls:
            - http://opensearch:9200
          indices:
            index_prefix: "jaeger-main"
            spans:        { date_layout: "2006-01-02", rollover_frequency: "day", shards: 1, replicas: 0 }
            services:     { date_layout: "2006-01-02", rollover_frequency: "day", shards: 1, replicas: 0 }
            dependencies: { date_layout: "2006-01-02", rollover_frequency: "day", shards: 1, replicas: 0 }
            sampling:     { date_layout: "2006-01-02", rollover_frequency: "day", shards: 1, replicas: 0 }

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: os_main
