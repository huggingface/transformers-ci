global:
  # CI-data Prometheus: only scrapes pytest_trace_exporter. Long retention
  # (90d in compose) preserves a quarter of CI history. Infrastructure
  # metrics (tempo/grafana/cadvisor/node_exporter/self) live in the separate
  # prometheus-infra instance with 14d retention so their high cardinality
  # doesn't eat the CI disk budget.
  scrape_interval: 5s

scrape_configs:
  - job_name: pytest_trace_exporter
    # The exporter renders synchronously inside the scrape: a cache-miss runs a
    # ~5s Tempo search and builds a large payload, which blew past the default
    # 5s scrape timeout (target went down with "context deadline exceeded", so
    # NO metrics landed). Give the scrape room; 30s also matches the dashboard
    # refresh and cuts Tempo query load.
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets:
          - pytest-trace-exporter:8000
