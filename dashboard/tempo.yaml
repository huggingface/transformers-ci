# Single-node Grafana Tempo for pytest trace storage.
#
# Replaces the previous Jaeger v2 + OpenSearch pair: Tempo ingests OTLP
# directly (no separate collector) and persists trace blocks to a local
# volume. The pytest-trace-exporter queries Tempo's HTTP API
# (/api/search + /api/traces/<id>) and Grafana reads it through the Tempo
# datasource.

# Lets Grafana stream search/trace results over HTTP from a single binary.
stream_over_http_enabled: true

# Bound search memory. Scanning blocks to answer /api/search is the main driver
# of Tempo's RAM spikes (the exporter polls a 1h window every render; the
# publisher searches 24h). Defaults (1000 concurrent jobs, unbounded duration)
# let a single wide search balloon the heap toward the 2 GiB limit and time out
# every other query. Cap the search range (the publisher needs 24h, so allow
# 26h) and the per-search parallelism; slightly slower searches, far flatter
# memory.
query_frontend:
  search:
    max_duration: 26h
    concurrent_jobs: 200

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          max_recv_msg_size_mib: 64
        http:
          endpoint: 0.0.0.0:4318
          # CI run traces can be 8 MB+ (10k+ spans per shard). Raise the OTLP
          # body limit well above Tempo's 4 MiB default so whole traces ingest
          # (used by the prod->staging trace backfill in aws/sync_prod_to_staging.py).
          max_request_body_size: 67108864  # 64 MiB

ingester:
  # Cut the head block fairly often so freshly ingested CI traces become
  # queryable (and visible to the exporter) within a few minutes.
  max_block_duration: 5m

compactor:
  compaction:
    # Overall trace retention. 90 days mirrors the Prometheus retention goal
    # so dashboards can look back over a full quarter of CI history.
    block_retention: 2160h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
