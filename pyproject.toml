[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformers-ci"
version = "0.1.0"
description = "Shared CI support code for transformers, including OpenTelemetry integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agentic = [
  "huggingface_hub>=0.25",
]
otel = [
  "emoji",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "pytest-opentelemetry",
]
pytest-plugin = [
  "psutil",
  "pytest>=8.0",
]
publish = [
  "huggingface_hub[cli,hf_xet]",
  "pyarrow",
]
test = [
  "emoji",
  "huggingface_hub>=0.25",
  "psutil",
  "pytest>=8.0",
]
dev = [
  "emoji",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "psutil",
  "pytest>=8.0",
  "pytest-opentelemetry",
]

[project.scripts]
configure-ci-otel = "transformersci.otel.cli:main"
report-ci-failure = "transformersci.otel.report_failure:main"
report-ci-start = "transformersci.otel.report_start:main"
pytest-trace-exporter = "transformersci.otel.trace_exporter:main"
integration-failure-triage = "transformersci.agentic.integration_failure_triage:main"
dashboard-failure-triage = "transformersci.agentic.dashboard_failure_triage:main"

[project.entry-points.pytest11]
transformersci_otel = "transformersci.otel.resource_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
