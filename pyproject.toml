[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformers-ci"
version = "0.1.0"
description = "Shared CI support code for transformers, including OpenTelemetry integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agentic = [
  "huggingface_hub>=0.25",
]
otel = [
  "emoji",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  # PINNED: span_pruning wraps pytest-opentelemetry's module-global `tracer` to
  # drop phase/fixture spans. That coupling is version-specific — an unpinned
  # `transformers-ci[otel] @ ...@main` docker build silently pulling a version
  # whose span routing escapes the wrap gives *partial* pruning (~2.76 spans/test
  # instead of ~1), the traces stay large, and the read path truncates failures
  # off the dashboard. 1.1.0 is verified fully effective (single-process + xdist);
  # bump deliberately and re-run tests/test_span_pruning.py before raising it.
  # See docs/plan-failure-visibility-regression-2026-07-15.md (fix #1).
  "pytest-opentelemetry==1.1.0",
]
pytest-plugin = [
  "psutil",
  "pytest>=8.0",
]
publish = [
  "huggingface_hub[cli,hf_xet]",
  "pyarrow",
]
test = [
  "emoji",
  "huggingface_hub>=0.25",
  "psutil",
  "pytest>=8.0",
]
dev = [
  "emoji",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "psutil",
  "pytest>=8.0",
  "pytest-opentelemetry==1.1.0",  # keep in sync with the [otel] extra above
]

[project.scripts]
configure-ci-otel = "transformersci.otel.cli:main"
report-ci-failure = "transformersci.otel.report_failure:main"
report-ci-start = "transformersci.otel.report_start:main"
pytest-trace-exporter = "transformersci.otel.trace_exporter:main"
integration-failure-triage = "transformersci.agentic.integration_failure_triage:main"
dashboard-failure-triage = "transformersci.agentic.dashboard_failure_triage:main"
serge-verify-verdict = "transformersci.agentic.serge_verify_verdict:main"

[project.entry-points.pytest11]
transformersci_otel = "transformersci.otel.resource_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
